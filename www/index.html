<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bloco de Notas Markdown</title>
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" type="image/png" href="icon-192.png">
  <meta name="theme-color" content="#0a0a0c">
  
  <!-- Google Fonts & Fira Code para o editor raw -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <!-- Capacitor Core Script -->
  <script src="capacitor.js"></script>
  <!-- Parser de Markdown e Conversores (Offline) -->
  <script src="marked.min.js"></script>
  <script src="turndown.js"></script>

  <style>
    :root {
      --bg-primary: #0a0a0c;
      --bg-secondary: rgba(18, 18, 22, 0.85);
      --bg-tertiary: #16161f;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.15);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-glow: rgba(79, 70, 229, 0.4);
      --success: #10b981;
      --success-hover: #059669;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'Fira Code', monospace;
      
      --font-size: 18px;
      --line-height: 1.6;
      --header-height: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
      position: relative;
    }

    /* Top Header Bar */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: rgba(10, 10, 12, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    /* Elementos Flutuantes originais reajustados para layout fixo */
    #menu-btn {
      position: static;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .top-actions {
      position: static;
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: var(--font-sans);
    }

    .action-btn:hover {
      background-color: var(--bg-secondary);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .action-btn:active {
      transform: translateY(1px);
    }

    .action-btn.active {
      background-color: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .action-btn.primary {
      background-color: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    .action-btn.primary:hover {
      background-color: var(--success-hover);
      border-color: var(--success-hover);
    }

    /* FAB - Botão Flutuante */
    .fab-new-note {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 99;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      border: none;
      color: #ffffff;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .fab-new-note:hover {
      transform: scale(1.1) rotate(90deg);
      box-shadow: 0 12px 32px var(--accent-glow);
    }

    .fab-new-note:active {
      transform: scale(0.95);
    }

    /* Sidebar / Aba Lateral */
    #sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 290px;
      height: 100vh;
      height: 100dvh;
      background: var(--bg-secondary);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-color);
      z-index: 200;
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom)) 20px;
      box-shadow: 15px 0 40px rgba(0, 0, 0, 0.8);
    }

    #sidebar.open {
      left: 0;
    }

    .sidebar-brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .search-box-container {
      position: relative;
      width: 100%;
      margin-bottom: 12px;
    }

    .search-box-container input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px 10px 38px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-sans);
      outline: none;
      transition: all 0.25s ease;
    }

    .search-box-container input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(79, 70, 229, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Toolbar de Formatação Rápida */
    .format-toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 6px 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .format-toolbar.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .format-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-family: var(--font-sans);
      font-weight: 600;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .format-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 20px;
      padding-right: 4px;
    }

    /* Scrollbar minimalista */
    .notes-list::-webkit-scrollbar, .view-pane::-webkit-scrollbar {
      width: 6px;
    }
    .notes-list::-webkit-scrollbar-track, .view-pane::-webkit-scrollbar-track {
      background: transparent;
    }
    .notes-list::-webkit-scrollbar-thumb, .view-pane::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    .notes-list::-webkit-scrollbar-thumb:hover, .view-pane::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .note-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .note-item:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-color: var(--border-hover);
      transform: translateX(4px);
    }

    .note-item.active {
      background: rgba(79, 70, 229, 0.15);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: inset 0 0 8px rgba(79, 70, 229, 0.2);
    }

    .note-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 8px;
    }

    .delete-note-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .delete-note-btn:hover {
      color: var(--danger);
      background-color: rgba(239, 68, 68, 0.15);
    }

    .sidebar-action-btn {
      background-color: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      text-align: center;
      font-family: var(--font-sans);
    }

    .sidebar-action-btn:hover {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Modais */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: var(--text-primary);
    }

    .modal-body {
      padding: 0;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .setting-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .setting-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .setting-description {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      transition: .3s;
      border-radius: 26px;
      border: 1px solid var(--border-color);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text-secondary);
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: #ffffff;
    }

    /* Containers de Visualização */
    .editor-container {
      width: 100%;
      height: calc(100vh - var(--header-height));
      margin-top: var(--header-height);
      position: relative;
      background-color: var(--bg-primary);
    }

    .view-pane {
      width: 100%;
      height: 100%;
      padding: 30px;
      font-size: var(--font-size);
      line-height: var(--line-height);
      overflow-y: auto;
      touch-action: pan-y;
      border: none;
      outline: none;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
    }

    .view-pane.active {
      display: block;
    }

    /* Modo Leitura */
    #read-pane {
      background-color: var(--bg-primary);
      color: #e4e4e7;
      user-select: text;
    }

    /* Modo Edição Visual */
    #edit-visual-pane {
      background-color: var(--bg-primary);
      color: #e4e4e7;
    }

    #edit-visual-pane:empty:before {
      content: "Comece a digitar sua nota...";
      font-size: var(--font-size);
      color: var(--text-muted);
      position: absolute;
      left: 30px;
      top: 30px;
      pointer-events: none;
    }

    /* Markdown Body Styling */
    .markdown-body {
      max-width: 800px;
      margin: 0 auto;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 { 
      margin-top: 1.4em;
      margin-bottom: 0.6em; 
      color: #ffffff; 
      font-weight: 600;
    }
    .markdown-body h1 { 
      font-size: 2.2em; 
      border-bottom: 1px solid var(--border-color); 
      padding-bottom: 0.4em; 
      margin-bottom: 1em; 
    }
    .markdown-body h2 { font-size: 1.65em; }
    .markdown-body h3 { font-size: 1.3em; }
    .markdown-body p { margin-bottom: 1.2em; color: rgba(255, 255, 255, 0.9); }
    .markdown-body code { 
      background: rgba(255, 255, 255, 0.06); 
      padding: 3px 6px; 
      border-radius: 6px; 
      font-family: var(--font-mono); 
      font-size: 0.9em;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .markdown-body pre { 
      background: var(--bg-tertiary); 
      padding: 16px; 
      border-radius: 12px; 
      overflow-x: auto; 
      margin-bottom: 1.4em; 
      border: 1px solid var(--border-color);
    }
    .markdown-body pre code { background: none; padding: 0; border: none; }
    .markdown-body ul, .markdown-body ol { margin-left: 24px; margin-bottom: 1.2em; color: rgba(255, 255, 255, 0.9); }
    .markdown-body li { margin-bottom: 0.4em; }
    .markdown-body blockquote { 
      border-left: 4px solid var(--accent); 
      padding-left: 16px; 
      color: var(--text-secondary); 
      margin-bottom: 1.4em; 
      font-style: italic;
    }

    #read-pane:empty:before {
      content: "Nota vazia.";
      color: var(--text-muted);
    }

    /* Modo Código Raw */
    #raw-pane {
      background-color: var(--bg-primary);
      color: rgba(255, 255, 255, 0.85);
      font-family: var(--font-mono);
      font-size: var(--font-size);
      resize: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: none;
      outline: none;
      padding: 30px;
    }

    #raw-pane::placeholder {
      color: var(--text-muted);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <button id="menu-btn" class="action-btn">
      <span style="font-size: 16px; vertical-align: middle;">☰</span> Notas
    </button>
    <div style="font-weight: 600; font-size: 16px; letter-spacing: -0.02em;"></div>
    <div class="top-actions">
      <button id="edit-btn" class="action-btn">Editar</button>
      <button id="save-btn" class="action-btn primary" style="display: none;">Salvar</button>
    </div>
  </header>

  <!-- Botão Flutuante (FAB) Nova Nota -->
  <button id="bottom-new-note-btn" class="fab-new-note" title="Nova Nota">+</button>

  <!-- Overlay Sidebar -->
  <div id="overlay"></div>

  <!-- Sidebar Lateral -->
  <div id="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-title" id="active-notebook-title">Minhas Notas</span>
      <span id="sync-indicator" style="display: none; font-size: 12px; animation: spin 1.5s linear infinite; color: var(--accent); user-select: none;">🔄</span>
    </div>

    <!-- Barra de Pesquisa Premium -->
    <div class="search-box-container">
      <input type="text" id="search-notes-input" placeholder="Pesquisar notas..." autocomplete="off">
      <span class="search-icon">🔍</span>
    </div>

    <div class="notes-list" id="notes-list"></div>
    <div class="sidebar-footer">
      <button id="preferences-btn" class="sidebar-action-btn">Preferências</button>
      <button id="install-app-btn" style="display: none;">📲 Instalar no Chrome</button>
    </div>
  </div>

  <!-- Modal de Preferências -->
  <div id="preferences-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Preferências</h2>
        <button id="close-preferences-btn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-title">Markdown Nativo</span>
            <span class="setting-description">Abre novas notas diretamente em formato Markdown</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="pref-markdown-checkbox">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Confirmação de Exclusão -->
  <div id="delete-confirm-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Confirmar Exclusão</h2>
        <button id="close-delete-modal-btn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color: #a1a1aa; font-size: 14px; margin-bottom: 24px; line-height: 1.5;" id="delete-modal-message">Deseja realmente excluir esta nota?</p>
        <div style="display: flex; justify-content: flex-end; gap: 12px;">
          <button id="cancel-delete-btn" class="action-btn">Cancelar</button>
          <button id="confirm-delete-btn" class="action-btn primary" style="background-color: #ef4444; border-color: #dc2626;">Excluir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Área de Conteúdo -->
  <div class="editor-container">
    <!-- Modo 1: Leitura Bloqueada -->
    <div id="read-pane" class="view-pane markdown-body active"></div>

    <!-- Modo 2: Edição Visual -->
    <div id="edit-visual-pane" class="view-pane markdown-body" contenteditable="true" spellcheck="false"></div>

    <!-- Modo 3: Código Raw -->
    <textarea id="raw-pane" class="view-pane" spellcheck="false" placeholder="Nova Nota&#10;&#10;Comece a digitar..."></textarea>

    <!-- Toolbar de Formatação Rápida (Markdown Helper) -->
    <div id="format-toolbar" class="format-toolbar">
      <button class="format-btn" onclick="insertFormat('bold')" title="Negrito">B</button>
      <button class="format-btn" onclick="insertFormat('italic')" title="Itálico">I</button>
      <button class="format-btn" onclick="insertFormat('header')" title="Título">H</button>
      <button class="format-btn" onclick="insertFormat('code')" title="Código">&lt;&gt;</button>
      <button class="format-btn" onclick="insertFormat('quote')" title="Citação">“</button>
      <button class="format-btn" onclick="insertFormat('list')" title="Lista">•</button>
    </div>
  </div>

  <script>
    const readPane = document.getElementById('read-pane');
    const editVisualPane = document.getElementById('edit-visual-pane');
    const rawPane = document.getElementById('raw-pane');

    const preferencesBtn = document.getElementById('preferences-btn');
    const preferencesModal = document.getElementById('preferences-modal');
    const closePreferencesBtn = document.getElementById('close-preferences-btn');
    const prefMarkdownCheckbox = document.getElementById('pref-markdown-checkbox');

    const deleteConfirmModal = document.getElementById('delete-confirm-modal');
    const closeDeleteModalBtn = document.getElementById('close-delete-modal-btn');
    const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
    const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
    const deleteModalMessage = document.getElementById('delete-modal-message');
    let noteIdToDelete = null;

    let prefersMarkdown = localStorage.getItem('notepad_prefers_markdown') === 'true';
    prefMarkdownCheckbox.checked = prefersMarkdown;

    const editBtn = document.getElementById('edit-btn');
    const saveBtn = document.getElementById('save-btn');
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const newNoteBtn = document.getElementById('new-note-btn');
    const notesListContainer = document.getElementById('notes-list');
    const activeNotebookTitle = document.getElementById('active-notebook-title');
    const installAppBtn = document.getElementById('install-app-btn');

    // Detecta se está rodando no Capacitor com o plugin Filesystem
    const isCapacitor = typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
    const fsDir = (typeof Capacitor !== 'undefined' && Capacitor.getPlatform() === 'android') ? 'EXTERNAL' : 'DOCUMENTS';

    // Gerenciador de Armazenamento Unificado (LocalStorage rápido + Filesystem em segundo plano)
    const NotebookStorage = {
      activeNotebook: 'Minhas Notas',
      notebooks: ['Minhas Notas'],
      notes: [],
      notebookPaths: JSON.parse(localStorage.getItem('notepad_notebook_paths')) || {},

      resolvePath(extraPath = '', notebookName = null) {
        const targetNotebook = notebookName || this.activeNotebook;
        const info = this.notebookPaths[targetNotebook];
        if (info && info.isExternal) {
          let resolved = info.path;
          if (extraPath) {
            resolved = resolved.endsWith('/') ? resolved + extraPath : resolved + '/' + extraPath;
          }
          return {
            path: resolved
          };
        } else {
          let resolved = `mkd-notes/${targetNotebook}`;
          if (extraPath) {
            resolved += '/' + extraPath;
          }
          return {
            path: resolved,
            directory: fsDir
          };
        }
      },

      async init() {
        if (isCapacitor) {
          try {
            // Solicita permissão de armazenamento ao sistema operacional
            const permStatus = await Capacitor.Plugins.Filesystem.checkPermissions();
            if (permStatus.publicStorage !== 'granted') {
              const reqResult = await Capacitor.Plugins.Filesystem.requestPermissions();
              if (reqResult.publicStorage !== 'granted') {
                console.warn("Permissão de armazenamento não concedida pelo usuário.");
              }
            }

            await Capacitor.Plugins.Filesystem.mkdir({
              path: 'mkd-notes',
              directory: fsDir,
              recursive: true
            }).catch(() => {});
            
            await this.loadNotebooksFS();
          } catch (e) {
            console.error("Falha ao inicializar Filesystem, usando localStorage fallback.", e);
            this.initLocalStorage();
          }
        } else {
          this.initLocalStorage();
        }
      },

      initLocalStorage() {
        this.notebooks = JSON.parse(localStorage.getItem('notepad_notebooks')) || ['Minhas Notas'];
        this.activeNotebook = localStorage.getItem('notepad_active_notebook') || 'Minhas Notas';
        if (!this.notebooks.includes(this.activeNotebook)) {
          this.activeNotebook = this.notebooks[0] || 'Minhas Notas';
        }
        this.loadNotesLS();
      },

      async loadNotebooksFS() {
        try {
          const result = await Capacitor.Plugins.Filesystem.readdir({
            path: 'mkd-notes',
            directory: fsDir
          });
          const dirs = result.files.map(f => typeof f === 'string' ? f : f.name);
          const externalNotebookNames = Object.keys(this.notebookPaths);
          const allNotebooks = Array.from(new Set([...dirs, ...externalNotebookNames]));

          if (allNotebooks.length === 0) {
            await this.createNotebookFS('Minhas Notas');
            this.notebooks = ['Minhas Notas'];
          } else {
            this.notebooks = allNotebooks;
          }
          this.activeNotebook = localStorage.getItem('notepad_active_notebook') || this.notebooks[0];
          if (!this.notebooks.includes(this.activeNotebook)) {
            this.activeNotebook = this.notebooks[0];
          }
          // Inicializa instantaneamente com o cache local
          this.loadNotesLS();
          // Dispara a sincronização de arquivos em segundo plano
          this.syncActiveNotebook();
        } catch (e) {
          console.error("Erro ao listar diretórios", e);
          this.initLocalStorage();
        }
      },

      async createNotebook(name) {
        name = name.trim();
        if (!name || this.notebooks.includes(name)) return false;
        this.notebooks.push(name);
        if (isCapacitor) {
          try {
            const isExternal = this.notebookPaths[name] && this.notebookPaths[name].isExternal;
            if (!isExternal) {
              await this.createNotebookFS(name);
            }
          } catch(e) {
            console.error("Erro ao criar diretório do caderno", e);
          }
        } else {
          localStorage.setItem('notepad_notebooks', JSON.stringify(this.notebooks));
        }
        return true;
      },

      async createNotebookFS(name) {
        await Capacitor.Plugins.Filesystem.mkdir({
          path: `mkd-notes/${name}`,
          directory: fsDir,
          recursive: true
        });
      },

      async loadNotes() {
        this.loadNotesLS(); // Carrega localStorage imediatamente (0ms)
        if (isCapacitor) {
          this.syncActiveNotebook(); // Sincroniza em segundo plano de forma não-bloqueante
        }
      },

      loadNotesLS() {
        const key = `notepad_notes_${this.activeNotebook}`;
        this.notes = JSON.parse(localStorage.getItem(key)) || [];
        if (this.notes.length === 0) {
          this.notes = [{
            id: Date.now().toString(),
            content: `# ${this.activeNotebook}\nComece a digitar sua primeira nota aqui...`
          }];
          this.saveNotesLS();
        }
      },

      async syncActiveNotebook() {
        if (!isCapacitor) return;
        const syncIndicator = document.getElementById('sync-indicator');
        if (syncIndicator) syncIndicator.style.display = 'inline-block';

        try {
          // Garante que a pasta existe
          await Capacitor.Plugins.Filesystem.mkdir(Object.assign({ recursive: true }, this.resolvePath())).catch(() => {});

          // Lista arquivos no disco
          const result = await Capacitor.Plugins.Filesystem.readdir(this.resolvePath());
          const files = result.files.map(f => typeof f === 'string' ? f : f.name);

          // Lê todos os arquivos .md da pasta
          const fsNotesMap = new Map();
          for (const file of files) {
            if (file.endsWith('.md')) {
              try {
                const fileContent = await Capacitor.Plugins.Filesystem.readFile(Object.assign({ encoding: 'utf8' }, this.resolvePath(file)));
                fsNotesMap.set(file.replace('.md', ''), fileContent.data);
              } catch (err) {
                console.error("Erro ao ler nota na sincronização", err);
              }
            }
          }

          const lsKey = `notepad_notes_${this.activeNotebook}`;
          let localNotes = JSON.parse(localStorage.getItem(lsKey)) || [];
          let hasChanges = false;

          // 1. Sincroniza do Disco -> LocalStorage (O disco sobressai se houver alteração)
          fsNotesMap.forEach((fsContent, id) => {
            const localNote = localNotes.find(n => n.id === id);
            if (!localNote) {
              localNotes.push({ id, content: fsContent });
              hasChanges = true;
            } else if (localNote.content !== fsContent) {
              localNote.content = fsContent;
              hasChanges = true;
            }
          });

          // 2. Sincroniza do LocalStorage -> Disco (Se nota local não existe no disco, grava)
          for (const localNote of localNotes) {
            if (!fsNotesMap.has(localNote.id)) {
              await this.saveNoteFS(localNote.id, localNote.content);
            }
          }

          if (hasChanges || localNotes.length === 0) {
            if (localNotes.length === 0) {
              localNotes = [{
                id: Date.now().toString(),
                content: `# ${this.activeNotebook}\nComece a digitar sua primeira nota aqui...`
              }];
              await this.saveNoteFS(localNotes[0].id, localNotes[0].content);
            }
            this.notes = localNotes.sort((a, b) => b.id.localeCompare(a.id));
            this.saveNotesLS();
            // Atualiza interface se houver mudanças importadas
            loadCurrentNote();
          } else {
            this.notes = localNotes.sort((a, b) => b.id.localeCompare(a.id));
          }
        } catch (e) {
          console.error("Erro ao rodar sincronização", e);
        } finally {
          if (syncIndicator) {
            // Suaviza o sumiço do ícone giratório para evitar flicker
            setTimeout(() => {
              syncIndicator.style.display = 'none';
            }, 600);
          }
        }
      },

      async saveNotes() {
        if (!isCapacitor) {
          this.saveNotesLS();
        }
      },

      saveNotesLS() {
        const key = `notepad_notes_${this.activeNotebook}`;
        localStorage.setItem(key, JSON.stringify(this.notes));
        localStorage.setItem('notepad_active_notebook', this.activeNotebook);
      },

      async saveNoteFS(id, content) {
        if (!isCapacitor) return;
        try {
          await Capacitor.Plugins.Filesystem.writeFile(Object.assign({ data: content, encoding: 'utf8' }, this.resolvePath(`${id}.md`)));
          localStorage.setItem('notepad_active_notebook', this.activeNotebook);
        } catch (e) {
          console.error("Erro ao salvar nota no Filesystem", e);
        }
      },

      async deleteNoteFS(id) {
        if (!isCapacitor) return;
        try {
          await Capacitor.Plugins.Filesystem.deleteFile(this.resolvePath(`${id}.md`));
        } catch (e) {
          console.error("Erro ao deletar arquivo", e);
        }
      }
    };

    // Estado do App
    let currentNoteId = null;
    let currentMode = 'read';
    let currentFontSize = parseFloat(localStorage.getItem('notepad_font_size')) || 18;

    // Renderizar Cadernos (removido)
    function renderNotebooksList() {
      // No-op
    }

    // Sidebar close
    overlay.addEventListener('click', closeSidebar);

    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    });

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }

    // Carregar Nota Atual
    function loadCurrentNote() {
      const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
      if (note) {
        setMode('read');
        updateDocumentTitle(note.content);
        renderNotesList();
      } else if (NotebookStorage.notes.length > 0) {
        currentNoteId = NotebookStorage.notes[0].id;
        loadCurrentNote();
      }
    }

    async function saveNotesToStorage() {
      // Salva no LocalStorage imediatamente para resposta rápida
      NotebookStorage.saveNotesLS();
      localStorage.setItem('notepad_current_note_id', currentNoteId);
      localStorage.setItem('notepad_current_note_id_' + NotebookStorage.activeNotebook, currentNoteId);

      // Envia a escrita do arquivo nativo em segundo plano (sem await/bloqueio)
      if (isCapacitor) {
        const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
        if (note) {
          NotebookStorage.saveNoteFS(note.id, note.content);
        }
      }
    }

    function getNoteTitle(content) {
      if (!content || content.trim() === '') return 'Nota Sem Título';
      const cleanContent = content.replace(/^#+\s+/g, '').trim();
      const firstLine = cleanContent.split('\n')[0] || '';
      return firstLine.substring(0, 20).trim() || 'Nota Sem Título';
    }

    function sanitizeFilename(title) {
      if (!title || title.trim() === '') return 'Nova Nota';
      // Remove caracteres proibidos em sistemas de arquivos
      let clean = title.replace(/[\/\\:*?"<>|]/g, '_').trim();
      return clean || 'Nova Nota';
    }

    async function getUniqueFilenameFS(notebook, desiredTitle, excludeId) {
      const baseName = sanitizeFilename(desiredTitle);
      let filename = `${baseName}.md`;
      if (!isCapacitor) {
        // Fallback localstorage
        const key = `notepad_notes_${notebook}`;
        const localNotes = JSON.parse(localStorage.getItem(key)) || [];
        let counter = 1;
        while (localNotes.some(n => n.id === filename.replace('.md', '') && n.id !== excludeId)) {
          counter++;
          filename = `${baseName}-${counter}.md`;
        }
        return filename;
      }
      try {
        const result = await Capacitor.Plugins.Filesystem.readdir(
          NotebookStorage.resolvePath('', notebook)
        );
        const files = result.files.map(f => typeof f === 'string' ? f : f.name);
        let counter = 1;
        while (files.includes(filename)) {
          if (filename.replace('.md', '') === excludeId) {
            break;
          }
          counter++;
          filename = `${baseName}-${counter}.md`;
        }
      } catch (e) {
        // Diretorio nao existe
      }
      return filename;
    }

    function renderNotesList() {
      notesListContainer.innerHTML = '';
      const searchInput = document.getElementById('search-notes-input');
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';

      const filteredNotes = NotebookStorage.notes.filter(note => {
        if (!query) return true;
        const title = getNoteTitle(note.content).toLowerCase();
        const content = note.content.toLowerCase();
        return title.includes(query) || content.includes(query);
      });

      filteredNotes.forEach(note => {
        const item = document.createElement('div');
        item.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
        
        const titleSpan = document.createElement('span');
        titleSpan.className = 'note-item-title';
        titleSpan.textContent = getNoteTitle(note.content);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-note-btn';
        deleteBtn.innerHTML = '✕';
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          deleteNote(note.id);
        };

        item.appendChild(titleSpan);
        if (NotebookStorage.notes.length > 1) {
          item.appendChild(deleteBtn);
        }

        item.onclick = () => {
          currentNoteId = note.id;
          saveNotesToStorage();
          loadCurrentNote();
          closeSidebar();
        };

        notesListContainer.appendChild(item);
      });
    }

    // Vincular input de busca
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('search-notes-input');
      if (searchInput) {
        searchInput.addEventListener('input', renderNotesList);
      }
    });



    const handleNewNote = async () => {
      let desiredTitle = 'Nova Nota';
      let uniqueFilename = await getUniqueFilenameFS(NotebookStorage.activeNotebook, desiredTitle, null);
      let newId = uniqueFilename.replace('.md', '');

      const newNote = {
        id: newId,
        content: ''
      };
      NotebookStorage.notes.unshift(newNote);
      currentNoteId = newNote.id;
      
      await saveNotesToStorage();
      loadCurrentNote();
      closeSidebar();
      setMode(prefersMarkdown ? 'raw' : 'visual'); // Já abre no modo edição preferido
    };

    if (newNoteBtn) {
      newNoteBtn.addEventListener('click', handleNewNote);
    }
    
    const bottomNewNoteBtn = document.getElementById('bottom-new-note-btn');
    if (bottomNewNoteBtn) {
      bottomNewNoteBtn.addEventListener('click', handleNewNote);
    }

    async function deleteNote(id) {
      if (NotebookStorage.notes.length <= 1) return;
      const note = NotebookStorage.notes.find(n => n.id === id);
      const title = getNoteTitle(note ? note.content : '');
      
      noteIdToDelete = id;
      deleteModalMessage.textContent = `Deseja realmente excluir a nota "${title}"?`;
      deleteConfirmModal.classList.add('active');
      deleteConfirmModal.style.display = 'flex';
    }

    const closeDeleteModal = () => {
      deleteConfirmModal.classList.remove('active');
      setTimeout(() => {
        if (!deleteConfirmModal.classList.contains('active')) {
          deleteConfirmModal.style.display = 'none';
        }
      }, 250);
      noteIdToDelete = null;
    };

    closeDeleteModalBtn.addEventListener('click', closeDeleteModal);
    cancelDeleteBtn.addEventListener('click', closeDeleteModal);
    deleteConfirmModal.addEventListener('click', (e) => {
      if (e.target === deleteConfirmModal) {
        closeDeleteModal();
      }
    });

    confirmDeleteBtn.addEventListener('click', async () => {
      if (noteIdToDelete) {
        const id = noteIdToDelete;
        NotebookStorage.notes = NotebookStorage.notes.filter(n => n.id !== id);
        if (isCapacitor) {
          await NotebookStorage.deleteNoteFS(id);
        }
        if (currentNoteId === id) {
          currentNoteId = NotebookStorage.notes[0].id;
        }
        saveNotesToStorage();
        loadCurrentNote();
        closeDeleteModal();
      }
    });

    // Inicialização do Turndown para conversão reversa de HTML para Markdown
    const turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });

    function getCleanMarkdownText(element) {
      let rawText = element.innerText || '';
      let lines = rawText.replace(/\u00A0/g, ' ').replace(/\r\n/g, '\n').split('\n');
      return lines.map(line => line.trimEnd()).join('\n').trim();
    }

    function getMarkdownFromHtml(element) {
      // Converte o HTML do painel visual de volta para Markdown usando Turndown
      return turndownService.turndown(element.innerHTML);
    }

    // Controle de Modos e Visibilidade
    function setMode(mode) {
      currentMode = mode;
      const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
      const content = note ? note.content : '';
      const formatToolbar = document.getElementById('format-toolbar');

      // Oculta todos
      readPane.classList.remove('active');
      editVisualPane.classList.remove('active');
      rawPane.classList.remove('active');

      if (mode === 'read') {
        readPane.innerHTML = content ? marked.parse(content) : '';
        readPane.classList.add('active');

        editBtn.style.display = 'block';
        saveBtn.style.display = 'none';
        if (formatToolbar) formatToolbar.classList.remove('visible');

      } else if (mode === 'visual') {
        editVisualPane.innerHTML = content ? marked.parse(content) : '';
        editVisualPane.classList.add('active');

        editBtn.style.display = 'none';
        saveBtn.style.display = 'block';
        editVisualPane.focus();
        if (formatToolbar) formatToolbar.classList.add('visible');

      } else if (mode === 'raw') {
        rawPane.value = content;
        rawPane.classList.add('active');

        editBtn.style.display = 'none';
        saveBtn.style.display = 'block';
        rawPane.focus();
        if (formatToolbar) formatToolbar.classList.add('visible');
      }
    }

    // Inserção e formatação rápida (Markdown Helper)
    function insertFormat(type) {
      if (currentMode === 'visual') {
        editVisualPane.focus();
        if (type === 'bold') {
          document.execCommand('bold', false);
        } else if (type === 'italic') {
          document.execCommand('italic', false);
        } else if (type === 'header') {
          document.execCommand('formatBlock', false, '<h3>');
        } else if (type === 'quote') {
          document.execCommand('formatBlock', false, '<blockquote>');
        } else if (type === 'list') {
          document.execCommand('insertUnorderedList', false);
        } else if (type === 'code') {
          const selection = window.getSelection();
          if (!selection.isCollapsed) {
            const range = selection.getRangeAt(0);
            const code = document.createElement('code');
            code.appendChild(range.extractContents());
            range.insertNode(code);
          }
        }
        editVisualPane.dispatchEvent(new Event('input'));
      } else if (currentMode === 'raw') {
        rawPane.focus();
        const start = rawPane.selectionStart;
        const end = rawPane.selectionEnd;
        const text = rawPane.value;
        const selectedText = text.substring(start, end);
        let replacement = '';

        if (type === 'bold') {
          replacement = `**${selectedText}**`;
        } else if (type === 'italic') {
          replacement = `*${selectedText}*`;
        } else if (type === 'header') {
          replacement = `\n### ${selectedText}`;
        } else if (type === 'quote') {
          replacement = `\n> ${selectedText}`;
        } else if (type === 'list') {
          replacement = `\n- ${selectedText}`;
        } else if (type === 'code') {
          replacement = `\`${selectedText}\``;
        }

        rawPane.value = text.substring(0, start) + replacement + text.substring(end);
        rawPane.selectionStart = start + replacement.length;
        rawPane.selectionEnd = start + replacement.length;
        
        rawPane.dispatchEvent(new Event('input'));
      }
    }

    // Eventos dos Botões
    editBtn.addEventListener('click', () => {
      setMode(prefersMarkdown ? 'raw' : 'visual');
    });

    // Modal de Preferências Listeners
    preferencesBtn.addEventListener('click', () => {
      preferencesModal.classList.add('active');
      preferencesModal.style.display = 'flex';
      closeSidebar();
    });

    const closePreferences = () => {
      preferencesModal.classList.remove('active');
      setTimeout(() => {
        if (!preferencesModal.classList.contains('active')) {
          preferencesModal.style.display = 'none';
        }
      }, 250);
    };

    closePreferencesBtn.addEventListener('click', closePreferences);
    preferencesModal.addEventListener('click', (e) => {
      if (e.target === preferencesModal) {
        closePreferences();
      }
    });

    prefMarkdownCheckbox.addEventListener('change', () => {
      prefersMarkdown = prefMarkdownCheckbox.checked;
      localStorage.setItem('notepad_prefers_markdown', prefersMarkdown);
      
      if (prefersMarkdown) {
        if (currentMode === 'visual') {
          const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
          if (note) note.content = getMarkdownFromHtml(editVisualPane);
          setMode('raw');
        }
      } else {
        if (currentMode === 'raw') {
          const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
          if (note) note.content = rawPane.value;
          setMode('visual');
        }
      }
    });

    saveBtn.addEventListener('click', async () => {
      const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
      if (note) {
        if (currentMode === 'visual') {
          note.content = getMarkdownFromHtml(editVisualPane);
        } else if (currentMode === 'raw') {
          note.content = rawPane.value;
        }

        // Verifica se o título mudou para realizar a renomeação segura
        const newTitle = getNoteTitle(note.content);
        const desiredFilename = await getUniqueFilenameFS(NotebookStorage.activeNotebook, newTitle, currentNoteId);
        const newId = desiredFilename.replace('.md', '');

        if (newId !== currentNoteId) {
          if (isCapacitor) {
            // Deleta o arquivo físico antigo
            await NotebookStorage.deleteNoteFS(currentNoteId);
          }
          // Remove no cache LS se necessário, ou atualiza id da lista
          note.id = newId;
          
          // Se for fallback do LocalStorage, também precisamos sincronizar a chave
          const key = `notepad_notes_${NotebookStorage.activeNotebook}`;
          localStorage.setItem(key, JSON.stringify(NotebookStorage.notes));

          currentNoteId = newId;
        }

        await saveNotesToStorage();
        updateDocumentTitle(note.content);
        renderNotesList();
      }
      setMode('read');
    });

    // Auto-save durante a digitação (otimizado sem renomear arquivos em tempo real para evitar lag)
    editVisualPane.addEventListener('input', async () => {
      const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
      if (note) {
        note.content = getMarkdownFromHtml(editVisualPane);
        await saveNotesToStorage();
        updateDocumentTitle(note.content);
        
        // Atualiza dinamicamente o título na sidebar sem reconstruir toda a lista
        const activeItem = notesListContainer.querySelector('.note-item.active .note-item-title');
        if (activeItem) {
          activeItem.textContent = getNoteTitle(note.content);
        }
      }
    });

    rawPane.addEventListener('input', async () => {
      const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
      if (note) {
        note.content = rawPane.value;
        await saveNotesToStorage();
        updateDocumentTitle(note.content);
        
        // Atualiza dinamicamente o título na sidebar sem reconstruir toda a lista
        const activeItem = notesListContainer.querySelector('.note-item.active .note-item-title');
        if (activeItem) {
          activeItem.textContent = getNoteTitle(note.content);
        }
      }
    });

    function updateDocumentTitle(content) {
      document.title = "Bloco de Notas";
    }

    // Zoom (Pinch-to-Zoom e Ctrl+Scroll)
    function updateFontSize(size) {
      currentFontSize = Math.min(Math.max(size, 10), 60);
      document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
      localStorage.setItem('notepad_font_size', currentFontSize);
    }

    // Inicialização da aplicação unificada
    async function initApp() {
      await NotebookStorage.init();
      activeNotebookTitle.textContent = NotebookStorage.activeNotebook;
      
      currentNoteId = localStorage.getItem('notepad_current_note_id_' + NotebookStorage.activeNotebook) || 
                      localStorage.getItem('notepad_current_note_id') || 
                      (NotebookStorage.notes[0] ? NotebookStorage.notes[0].id : null);
      
      if (!currentNoteId && NotebookStorage.notes.length > 0) {
        currentNoteId = NotebookStorage.notes[0].id;
      }

      loadCurrentNote();
      renderNotebooksList();
      updateFontSize(currentFontSize);
    }
    initApp();

    let initialDistance = null;
    let initialFontSize = 18;

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = getDistance(e.touches);
        initialFontSize = currentFontSize;
      }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialDistance !== null) {
        const newDistance = getDistance(e.touches);
        const scale = newDistance / initialDistance;
        updateFontSize(initialFontSize * scale);
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialDistance = null;
    }, { passive: true });

    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    document.addEventListener('wheel', (e) => {
      if (e.ctrlKey) {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 1.1 : 0.9;
        updateFontSize(currentFontSize * delta);
      }
    }, { passive: false });

    // --- PWA / Instalação no Chrome ---
    let deferredPrompt;

    if ('serviceWorker' in navigator && !isCapacitor) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('Service Worker registrado com sucesso:', reg.scope);
        }).catch((err) => {
          console.warn('Erro ao registrar Service Worker:', err);
        });
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isCapacitor && installAppBtn) {
        installAppBtn.style.display = 'flex';
      }
    });

    if (installAppBtn) {
      installAppBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`Escolha do usuário sobre instalação: ${outcome}`);
        deferredPrompt = null;
        installAppBtn.style.display = 'none';
      });
    }

    window.addEventListener('appinstalled', () => {
      console.log('Aplicativo instalado com sucesso.');
      deferredPrompt = null;
      if (installAppBtn) installAppBtn.style.display = 'none';
    });
  </script>
</body>
</html>
