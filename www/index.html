<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bloco de Notas Markdown</title>
  
  <!-- Capacitor Core Script -->
  <script src="capacitor.js"></script>
  <!-- Parser de Markdown e Conversores (Offline) -->
  <script src="marked.min.js"></script>
  <script src="turndown.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --font-size: 18px;
      --line-height: 1.6;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
      position: relative;
    }

    /* Controles Superiores */
    #menu-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      background-color: #1a1a1a;
      color: #ffffff;
      border: 1px solid #333333;
      padding: 4px 10px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }

    .top-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 100;
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background-color: #1a1a1a;
      color: #888888;
      border: 1px solid #333333;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .action-btn.active {
      background-color: #0066cc;
      color: #ffffff;
      border-color: #0055b3;
    }

    .action-btn.primary {
      background-color: #16a34a;
      color: #ffffff;
      border-color: #15803d;
    }

    /* Sidebar / Aba Lateral */
    #sidebar {
      position: absolute;
      top: 0;
      left: -290px;
      width: 280px;
      height: 100%;
      background-color: #0c0c0c;
      border-right: 1px solid #1f1f23;
      z-index: 200;
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 16px;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.6);
    }

    #sidebar.open {
      left: 0;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1f1f23;
      cursor: pointer;
      user-select: none;
    }

    .sidebar-title {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    #notebook-toggle-arrow {
      font-size: 12px;
      color: #71717a;
      transition: transform 0.25s ease;
      margin-left: 8px;
    }

    #notebook-toggle-arrow.open {
      transform: rotate(180deg);
    }

    #notebooks-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: 1px solid transparent;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.25s linear,
                  margin-bottom 0.35s ease,
                  padding-bottom 0.35s ease,
                  border-color 0.35s ease;
    }

    #notebooks-section.open {
      max-height: 290px;
      opacity: 1;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1f1f23;
    }

    #new-notebook-btn {
      background-color: #161618;
      color: #a1a1aa;
      border: 1px solid #27272a;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      transition: all 0.2s;
    }

    #new-notebook-btn:hover {
      background-color: #27272a;
      color: #ffffff;
      border-color: #3f3f46;
    }

    #locate-notebook-btn {
      background-color: #161618;
      color: #a1a1aa;
      border: 1px solid #27272a;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      margin-top: 4px;
      width: 100%;
    }

    #locate-notebook-btn:hover {
      background-color: #27272a;
      color: #ffffff;
      border-color: #3f3f46;
    }

    .notebooks-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 160px;
      overflow-y: auto;
    }

    .notebook-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background-color: #161618;
      border: 1px solid #27272a;
      border-radius: 4px;
      cursor: pointer;
      color: #a1a1aa;
      font-size: 13px;
      transition: all 0.2s;
    }

    .notebook-item:hover, .notebook-item.active {
      background-color: #27272a;
      color: #ffffff;
      border-color: #3f3f46;
    }

    .notebook-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    #new-note-btn {
      background-color: #0066cc;
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 12px;
      transition: background-color 0.2s;
    }

    #new-note-btn:hover {
      background-color: #0052a3;
    }

    #search-input {
      display: none;
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .note-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background-color: #1a1a1a;
      border: 1px solid #27272a;
      border-radius: 4px;
      cursor: pointer;
      color: #a1a1aa;
      font-size: 14px;
      transition: all 0.2s;
    }

    .note-item:hover, .note-item.active {
      background-color: #27272a;
      color: #ffffff;
      border-color: #3f3f46;
    }

    .note-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 8px;
    }

    .delete-note-btn {
      background: none;
      border: none;
      color: #71717a;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
    }

    .delete-note-btn:hover {
      color: #ef4444;
    }

    /* Containers de Visualização */
    .editor-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .view-pane {
      width: 100%;
      height: 100%;
      padding: 55px 20px 20px 20px;
      font-size: var(--font-size);
      line-height: var(--line-height);
      overflow-y: auto;
      touch-action: pan-y;
      border: none;
      outline: none;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
    }

    .view-pane.active {
      display: block;
    }

    /* 1. Modo Leitura (Renderizado Bloqueado) */
    #read-pane {
      background-color: #000000;
      color: #e4e4e7;
      user-select: text;
    }

    /* 2. Modo Edição Visual (WYSIWYG) */
    #edit-visual-pane {
      background-color: #000000;
      color: #e4e4e7;
    }

    /* Estilização Interna do Markdown (Compartilhada) */
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { 
      margin-top: 0.8em;
      margin-bottom: 0.4em; 
      color: #fff; 
    }
    .markdown-body h1 { font-size: 2em; border-bottom: 1px solid #27272a; padding-bottom: 0.3em; }
    .markdown-body h2 { font-size: 1.5em; }
    .markdown-body h3 { font-size: 1.2em; }
    .markdown-body p { margin-bottom: 1em; }
    .markdown-body code { background: #1f1f23; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    .markdown-body pre { background: #1f1f23; padding: 12px; border-radius: 6px; overflow-x: auto; margin-bottom: 1em; }
    .markdown-body pre code { background: none; padding: 0; }
    .markdown-body ul, .markdown-body ol { margin-left: 20px; margin-bottom: 1em; }
    .markdown-body blockquote { border-left: 4px solid #3f3f46; padding-left: 12px; color: #a1a1aa; margin-bottom: 1em; }

    /* Placeholders Esmaecidos */
    #edit-visual-pane:empty:before {
      content: "### Título\n\nComece a digitar...";
      color: #4a4a4a;
      white-space: pre-wrap;
    }

    #read-pane:empty:before {
      content: "Nota vazia.";
      color: #4a4a4a;
    }

    /* 3. Modo Código Markdown (Textarea Raw) */
    #raw-pane {
      background-color: #000000;
      color: #a1a1aa;
      font-family: "Fira Code", monospace, monospace;
      resize: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    #raw-pane::placeholder {
      color: #4a4a4a;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Botão Sidebar -->
  <button id="menu-btn">☰</button>

  <!-- Botões de Ação Superiores -->
  <div class="top-actions">
    <button id="edit-btn" class="action-btn">Editar</button>
    <button id="markdown-btn" class="action-btn" style="display: none;">Markdown</button>
    <button id="save-btn" class="action-btn primary" style="display: none;">Salvar</button>
  </div>

  <!-- Overlay Sidebar -->
  <div id="overlay"></div>

  <!-- Sidebar Lateral -->
  <div id="sidebar">
    <div class="sidebar-header" id="notebook-header">
      <span class="sidebar-title" id="active-notebook-title">Minhas Notas</span>
      <span id="sync-indicator" style="display: none; font-size: 12px; margin-right: 8px; animation: spin 1.5s linear infinite; color: #a1a1aa; user-select: none;">🔄</span>
      <span id="notebook-toggle-arrow">▼</span>
    </div>
    
    <div id="notebooks-section" class="notebooks-section">
      <button id="new-notebook-btn">+ Novo Caderno</button>
      <button id="locate-notebook-btn"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>Fonte</button>
      <div class="notebooks-list" id="notebooks-list"></div>
    </div>

    <button id="new-note-btn">+ Nova Nota</button>
    <div class="notes-list" id="notes-list"></div>
  </div>

  <!-- Área de Conteúdo -->
  <div class="editor-container">
    <!-- Modo 1: Leitura Bloqueada -->
    <div id="read-pane" class="view-pane markdown-body active"></div>

    <!-- Modo 2: Edição Visual -->
    <div id="edit-visual-pane" class="view-pane markdown-body" contenteditable="true" spellcheck="false"></div>

    <!-- Modo 3: Código Raw -->
    <textarea id="raw-pane" class="view-pane" spellcheck="false" placeholder="### Título&#10;&#10;Comece a digitar..."></textarea>
  </div>

  <script>
    const readPane = document.getElementById('read-pane');
    const editVisualPane = document.getElementById('edit-visual-pane');
    const rawPane = document.getElementById('raw-pane');

    const editBtn = document.getElementById('edit-btn');
    const markdownBtn = document.getElementById('markdown-btn');
    const saveBtn = document.getElementById('save-btn');

    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const newNoteBtn = document.getElementById('new-note-btn');
    const notesListContainer = document.getElementById('notes-list');
    const locateNotebookBtn = document.getElementById('locate-notebook-btn');

    const activeNotebookTitle = document.getElementById('active-notebook-title');
    const notebookToggleArrow = document.getElementById('notebook-toggle-arrow');
    const notebooksSection = document.getElementById('notebooks-section');
    const notebooksListContainer = document.getElementById('notebooks-list');
    const newNotebookBtn = document.getElementById('new-notebook-btn');
    const notebookHeader = document.getElementById('notebook-header');

    // Detecta se está rodando no Capacitor com o plugin Filesystem
    const isCapacitor = typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Filesystem;

    // Gerenciador de Armazenamento Unificado (LocalStorage rápido + Filesystem em segundo plano)
    const NotebookStorage = {
      activeNotebook: 'Minhas Notas',
      notebooks: ['Minhas Notas'],
      notes: [],
      notebookPaths: JSON.parse(localStorage.getItem('notepad_notebook_paths')) || {},

      resolvePath(extraPath = '', notebookName = null) {
        const targetNotebook = notebookName || this.activeNotebook;
        const info = this.notebookPaths[targetNotebook];
        if (info && info.isExternal) {
          let resolved = info.path;
          if (extraPath) {
            resolved = resolved.endsWith('/') ? resolved + extraPath : resolved + '/' + extraPath;
          }
          return {
            path: resolved
          };
        } else {
          let resolved = `mkd-notes/${targetNotebook}`;
          if (extraPath) {
            resolved += '/' + extraPath;
          }
          return {
            path: resolved,
            directory: 'DOCUMENTS'
          };
        }
      },

      async init() {
        if (isCapacitor) {
          try {
            // Solicita permissão de armazenamento ao sistema operacional
            const permStatus = await Capacitor.Plugins.Filesystem.checkPermissions();
            if (permStatus.publicStorage !== 'granted') {
              const reqResult = await Capacitor.Plugins.Filesystem.requestPermissions();
              if (reqResult.publicStorage !== 'granted') {
                console.warn("Permissão de armazenamento não concedida pelo usuário.");
              }
            }

            await Capacitor.Plugins.Filesystem.mkdir({
              path: 'mkd-notes',
              directory: 'DOCUMENTS',
              recursive: true
            }).catch(() => {});
            
            await this.loadNotebooksFS();
          } catch (e) {
            console.error("Falha ao inicializar Filesystem, usando localStorage fallback.", e);
            this.initLocalStorage();
          }
        } else {
          this.initLocalStorage();
        }
      },

      initLocalStorage() {
        this.notebooks = JSON.parse(localStorage.getItem('notepad_notebooks')) || ['Minhas Notas'];
        this.activeNotebook = localStorage.getItem('notepad_active_notebook') || 'Minhas Notas';
        if (!this.notebooks.includes(this.activeNotebook)) {
          this.activeNotebook = this.notebooks[0] || 'Minhas Notas';
        }
        this.loadNotesLS();
      },

      async loadNotebooksFS() {
        try {
          const result = await Capacitor.Plugins.Filesystem.readdir({
            path: 'mkd-notes',
            directory: 'DOCUMENTS'
          });
          const dirs = result.files.map(f => typeof f === 'string' ? f : f.name);
          const externalNotebookNames = Object.keys(this.notebookPaths);
          const allNotebooks = Array.from(new Set([...dirs, ...externalNotebookNames]));

          if (allNotebooks.length === 0) {
            await this.createNotebookFS('Minhas Notas');
            this.notebooks = ['Minhas Notas'];
          } else {
            this.notebooks = allNotebooks;
          }
          this.activeNotebook = localStorage.getItem('notepad_active_notebook') || this.notebooks[0];
          if (!this.notebooks.includes(this.activeNotebook)) {
            this.activeNotebook = this.notebooks[0];
          }
          // Inicializa instantaneamente com o cache local
          this.loadNotesLS();
          // Dispara a sincronização de arquivos em segundo plano
          this.syncActiveNotebook();
        } catch (e) {
          console.error("Erro ao listar diretórios", e);
          this.initLocalStorage();
        }
      },

      async createNotebook(name) {
        name = name.trim();
        if (!name || this.notebooks.includes(name)) return false;
        this.notebooks.push(name);
        if (isCapacitor) {
          try {
            const isExternal = this.notebookPaths[name] && this.notebookPaths[name].isExternal;
            if (!isExternal) {
              await this.createNotebookFS(name);
            }
          } catch(e) {
            console.error("Erro ao criar diretório do caderno", e);
          }
        } else {
          localStorage.setItem('notepad_notebooks', JSON.stringify(this.notebooks));
        }
        return true;
      },

      async createNotebookFS(name) {
        await Capacitor.Plugins.Filesystem.mkdir({
          path: `mkd-notes/${name}`,
          directory: 'DOCUMENTS',
          recursive: true
        });
      },

      async loadNotes() {
        this.loadNotesLS(); // Carrega localStorage imediatamente (0ms)
        if (isCapacitor) {
          this.syncActiveNotebook(); // Sincroniza em segundo plano de forma não-bloqueante
        }
      },

      loadNotesLS() {
        const key = `notepad_notes_${this.activeNotebook}`;
        this.notes = JSON.parse(localStorage.getItem(key)) || [];
        if (this.notes.length === 0) {
          this.notes = [{
            id: Date.now().toString(),
            content: `# ${this.activeNotebook}\nComece a digitar sua primeira nota aqui...`
          }];
          this.saveNotesLS();
        }
      },

      async syncActiveNotebook() {
        if (!isCapacitor) return;
        const syncIndicator = document.getElementById('sync-indicator');
        if (syncIndicator) syncIndicator.style.display = 'inline-block';

        try {
          // Garante que a pasta existe
          await Capacitor.Plugins.Filesystem.mkdir(Object.assign({ recursive: true }, this.resolvePath())).catch(() => {});

          // Lista arquivos no disco
          const result = await Capacitor.Plugins.Filesystem.readdir(this.resolvePath());
          const files = result.files.map(f => typeof f === 'string' ? f : f.name);

          // Lê todos os arquivos .md da pasta
          const fsNotesMap = new Map();
          for (const file of files) {
            if (file.endsWith('.md')) {
              try {
                const fileContent = await Capacitor.Plugins.Filesystem.readFile(Object.assign({ encoding: 'utf8' }, this.resolvePath(file)));
                fsNotesMap.set(file.replace('.md', ''), fileContent.data);
              } catch (err) {
                console.error("Erro ao ler nota na sincronização", err);
              }
            }
          }

          const lsKey = `notepad_notes_${this.activeNotebook}`;
          let localNotes = JSON.parse(localStorage.getItem(lsKey)) || [];
          let hasChanges = false;

          // 1. Sincroniza do Disco -> LocalStorage (O disco sobressai se houver alteração)
          fsNotesMap.forEach((fsContent, id) => {
            const localNote = localNotes.find(n => n.id === id);
            if (!localNote) {
              localNotes.push({ id, content: fsContent });
              hasChanges = true;
            } else if (localNote.content !== fsContent) {
              localNote.content = fsContent;
              hasChanges = true;
            }
          });

          // 2. Sincroniza do LocalStorage -> Disco (Se nota local não existe no disco, grava)
          for (const localNote of localNotes) {
            if (!fsNotesMap.has(localNote.id)) {
              await this.saveNoteFS(localNote.id, localNote.content);
            }
          }

          if (hasChanges || localNotes.length === 0) {
            if (localNotes.length === 0) {
              localNotes = [{
                id: Date.now().toString(),
                content: `# ${this.activeNotebook}\nComece a digitar sua primeira nota aqui...`
              }];
              await this.saveNoteFS(localNotes[0].id, localNotes[0].content);
            }
            this.notes = localNotes.sort((a, b) => b.id.localeCompare(a.id));
            this.saveNotesLS();
            // Atualiza interface se houver mudanças importadas
            loadCurrentNote();
          } else {
            this.notes = localNotes.sort((a, b) => b.id.localeCompare(a.id));
          }
        } catch (e) {
          console.error("Erro ao rodar sincronização", e);
        } finally {
          if (syncIndicator) {
            // Suaviza o sumiço do ícone giratório para evitar flicker
            setTimeout(() => {
              syncIndicator.style.display = 'none';
            }, 600);
          }
        }
      },

      async saveNotes() {
        if (!isCapacitor) {
          this.saveNotesLS();
        }
      },

      saveNotesLS() {
        const key = `notepad_notes_${this.activeNotebook}`;
        localStorage.setItem(key, JSON.stringify(this.notes));
        localStorage.setItem('notepad_active_notebook', this.activeNotebook);
      },

      async saveNoteFS(id, content) {
        if (!isCapacitor) return;
        try {
          await Capacitor.Plugins.Filesystem.writeFile(Object.assign({ data: content, encoding: 'utf8' }, this.resolvePath(`${id}.md`)));
          localStorage.setItem('notepad_active_notebook', this.activeNotebook);
        } catch (e) {
          console.error("Erro ao salvar nota no Filesystem", e);
        }
      },

      async deleteNoteFS(id) {
        if (!isCapacitor) return;
        try {
          await Capacitor.Plugins.Filesystem.deleteFile(this.resolvePath(`${id}.md`));
        } catch (e) {
          console.error("Erro ao deletar arquivo", e);
        }
      }
    };

    // Estado do App
    let currentNoteId = null;
    let currentMode = 'read';
    let currentFontSize = parseFloat(localStorage.getItem('notepad_font_size')) || 18;

    // Toggle aba de cadernos
    notebookHeader.addEventListener('click', () => {
      notebooksSection.classList.toggle('open');
      notebookToggleArrow.classList.toggle('open');
    });

    // Criar Caderno
    newNotebookBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const name = prompt("Digite o nome do novo caderno:");
      if (name && name.trim()) {
        const created = await NotebookStorage.createNotebook(name);
        if (created) {
          NotebookStorage.activeNotebook = name.trim();
          await NotebookStorage.loadNotes();
          activeNotebookTitle.textContent = NotebookStorage.activeNotebook;
          notebooksSection.classList.remove('open');
          notebookToggleArrow.classList.remove('open');
          
          currentNoteId = NotebookStorage.notes[0]?.id || null;
          saveNotesToStorage();
          loadCurrentNote();
          renderNotebooksList();
        } else {
          alert("O caderno já existe ou o nome é inválido.");
        }
      }
    });

    // Localizar Caderno
    async function locateNotebookFolder() {
      if (isCapacitor) {
        try {
          const result = await Capacitor.Plugins.FilePicker.pickDirectory();
          if (result && result.path) {
            // Extrai o nome da pasta a partir do caminho/URI
            const pathDecoded = decodeURIComponent(result.path);
            const parts = pathDecoded.split('/');
            let lastPart = parts.pop() || parts.pop() || '';
            if (lastPart.includes(':')) {
              lastPart = lastPart.split(':').pop();
            }
            const folderName = lastPart || 'Pasta Selecionada';
            
            // Registra esta pasta nas rotas/caminhos de cadernos
            NotebookStorage.notebookPaths[folderName] = {
              path: result.path,
              isExternal: true
            };
            localStorage.setItem('notepad_notebook_paths', JSON.stringify(NotebookStorage.notebookPaths));

            const created = await NotebookStorage.createNotebook(folderName);
            NotebookStorage.activeNotebook = folderName;
            await NotebookStorage.loadNotes();
            activeNotebookTitle.textContent = folderName;
            notebooksSection.classList.remove('open');
            notebookToggleArrow.classList.remove('open');
            currentNoteId = NotebookStorage.notes[0]?.id || null;
            saveNotesToStorage();
            loadCurrentNote();
            renderNotebooksList();
          }
          return;
        } catch (err) {
          console.error("Erro ao selecionar diretório pelo FilePicker", err);
          alert("Não foi possível acessar a pasta selecionada: " + err.message);
          return;
        }
      }

      if (typeof window.showDirectoryPicker === 'function') {
        try {
          const dirHandle = await window.showDirectoryPicker();
          const folderName = dirHandle.name;
          const created = await NotebookStorage.createNotebook(folderName);
          if (created || NotebookStorage.notebooks.includes(folderName)) {
            NotebookStorage.activeNotebook = folderName;
            await NotebookStorage.loadNotes();
            activeNotebookTitle.textContent = folderName;
            notebooksSection.classList.remove('open');
            notebookToggleArrow.classList.remove('open');
            currentNoteId = NotebookStorage.notes[0]?.id || null;
            saveNotesToStorage();
            loadCurrentNote();
            renderNotebooksList();
          }
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
          console.warn("showDirectoryPicker falhou, tentando fallback", err);
        }
      }

      const name = prompt("Digite o nome da pasta existente no seu diretório 'Documentos' para sincronizar como caderno:");
      if (name && name.trim()) {
        const folderName = name.trim();
        await NotebookStorage.createNotebook(folderName);
        NotebookStorage.activeNotebook = folderName;
        await NotebookStorage.loadNotes();
        activeNotebookTitle.textContent = folderName;
        notebooksSection.classList.remove('open');
        notebookToggleArrow.classList.remove('open');
        currentNoteId = NotebookStorage.notes[0]?.id || null;
        saveNotesToStorage();
        loadCurrentNote();
        renderNotebooksList();
      }
    }

    // Renderizar Cadernos
    function renderNotebooksList() {
      notebooksListContainer.innerHTML = '';
      NotebookStorage.notebooks.forEach(notebook => {
        const item = document.createElement('div');
        item.className = `notebook-item ${notebook === NotebookStorage.activeNotebook ? 'active' : ''}`;
        
        const titleSpan = document.createElement('span');
        titleSpan.className = 'notebook-item-title';
        titleSpan.textContent = notebook;

        item.appendChild(titleSpan);

        item.onclick = async (e) => {
          e.stopPropagation();
          NotebookStorage.activeNotebook = notebook;
          await NotebookStorage.loadNotes();
          activeNotebookTitle.textContent = notebook;
          notebooksSection.classList.remove('open');
          notebookToggleArrow.classList.remove('open');
          
          currentNoteId = localStorage.getItem('notepad_current_note_id_' + notebook) || NotebookStorage.notes[0]?.id || null;
          saveNotesToStorage();
          loadCurrentNote();
          renderNotebooksList();
        };

        notebooksListContainer.appendChild(item);
      });
    }

    // Sidebar close
    overlay.addEventListener('click', closeSidebar);

    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    });

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }

    // Carregar Nota Atual
    function loadCurrentNote() {
      const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
      if (note) {
        setMode('read');
        updateDocumentTitle(note.content);
        renderNotesList();
      } else if (NotebookStorage.notes.length > 0) {
        currentNoteId = NotebookStorage.notes[0].id;
        loadCurrentNote();
      }
    }

    async function saveNotesToStorage() {
      // Salva no LocalStorage imediatamente para resposta rápida
      NotebookStorage.saveNotesLS();
      localStorage.setItem('notepad_current_note_id', currentNoteId);
      localStorage.setItem('notepad_current_note_id_' + NotebookStorage.activeNotebook, currentNoteId);

      // Envia a escrita do arquivo nativo em segundo plano (sem await/bloqueio)
      if (isCapacitor) {
        const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
        if (note) {
          NotebookStorage.saveNoteFS(note.id, note.content);
        }
      }
    }

    function getNoteTitle(content) {
      if (!content || content.trim() === '') return 'Nova Nota';
      const match = content.match(/^#+\s+(.*)/m);
      if (match && match[1]) {
        return match[1].trim();
      }
      const firstLine = content.trim().split('\n')[0] || '';
      return firstLine.substring(0, 24) || 'Nova Nota';
    }

    function sanitizeFilename(title) {
      if (!title || title.trim() === '') return 'Nova Nota';
      // Remove caracteres proibidos em sistemas de arquivos
      let clean = title.replace(/[\/\\:*?"<>|]/g, '_').trim();
      return clean || 'Nova Nota';
    }

    async function getUniqueFilenameFS(notebook, desiredTitle, excludeId) {
      const baseName = sanitizeFilename(desiredTitle);
      let filename = `${baseName}.md`;
      if (!isCapacitor) {
        // Fallback localstorage
        const key = `notepad_notes_${notebook}`;
        const localNotes = JSON.parse(localStorage.getItem(key)) || [];
        let counter = 1;
        while (localNotes.some(n => n.id === filename.replace('.md', '') && n.id !== excludeId)) {
          counter++;
          filename = `${baseName}-${counter}.md`;
        }
        return filename;
      }
      try {
        const result = await Capacitor.Plugins.Filesystem.readdir(
          NotebookStorage.resolvePath('', notebook)
        );
        const files = result.files.map(f => typeof f === 'string' ? f : f.name);
        let counter = 1;
        while (files.includes(filename)) {
          if (filename.replace('.md', '') === excludeId) {
            break;
          }
          counter++;
          filename = `${baseName}-${counter}.md`;
        }
      } catch (e) {
        // Diretorio nao existe
      }
      return filename;
    }

    function renderNotesList() {
      notesListContainer.innerHTML = '';
      NotebookStorage.notes.forEach(note => {
        const item = document.createElement('div');
        item.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
        
        const titleSpan = document.createElement('span');
        titleSpan.className = 'note-item-title';
        titleSpan.textContent = getNoteTitle(note.content);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-note-btn';
        deleteBtn.innerHTML = '✕';
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          deleteNote(note.id);
        };

        item.appendChild(titleSpan);
        if (NotebookStorage.notes.length > 1) {
          item.appendChild(deleteBtn);
        }

        item.onclick = () => {
          currentNoteId = note.id;
          saveNotesToStorage();
          loadCurrentNote();
          closeSidebar();
        };

        notesListContainer.appendChild(item);
      });
    }

    locateNotebookBtn.addEventListener('click', locateNotebookFolder);

    newNoteBtn.addEventListener('click', async () => {
      let desiredTitle = 'Nova Nota';
      let uniqueFilename = await getUniqueFilenameFS(NotebookStorage.activeNotebook, desiredTitle, null);
      let newId = uniqueFilename.replace('.md', '');

      const newNote = {
        id: newId,
        content: ''
      };
      NotebookStorage.notes.unshift(newNote);
      currentNoteId = newNote.id;
      
      await saveNotesToStorage();
      loadCurrentNote();
      closeSidebar();
      setMode('visual'); // Já abre no modo edição
    });

    async function deleteNote(id) {
      if (NotebookStorage.notes.length <= 1) return;
      const note = NotebookStorage.notes.find(n => n.id === id);
      const title = getNoteTitle(note ? note.content : '');
      if (!confirm(`Deseja realmente excluir a nota "${title}"?`)) return;

      NotebookStorage.notes = NotebookStorage.notes.filter(n => n.id !== id);
      if (isCapacitor) {
        await NotebookStorage.deleteNoteFS(id);
      }
      if (currentNoteId === id) {
        currentNoteId = NotebookStorage.notes[0].id;
      }
      saveNotesToStorage();
      loadCurrentNote();
    }

    // Inicialização do Turndown para conversão reversa de HTML para Markdown
    const turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });

    function getCleanMarkdownText(element) {
      let rawText = element.innerText || '';
      let lines = rawText.replace(/\u00A0/g, ' ').replace(/\r\n/g, '\n').split('\n');
      return lines.map(line => line.trimEnd()).join('\n').trim();
    }

    function getMarkdownFromHtml(element) {
      // Converte o HTML do painel visual de volta para Markdown usando Turndown
      return turndownService.turndown(element.innerHTML);
    }

    // Controle de Modos e Visibilidade
    function setMode(mode) {
      currentMode = mode;
      const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
      const content = note ? note.content : '';

      // Oculta todos
      readPane.classList.remove('active');
      editVisualPane.classList.remove('active');
      rawPane.classList.remove('active');

      if (mode === 'read') {
        readPane.innerHTML = content ? marked.parse(content) : '';
        readPane.classList.add('active');

        editBtn.style.display = 'block';
        markdownBtn.style.display = 'none';
        saveBtn.style.display = 'none';
        markdownBtn.classList.remove('active');

      } else if (mode === 'visual') {
        editVisualPane.innerHTML = content ? marked.parse(content) : '';
        editVisualPane.classList.add('active');

        editBtn.style.display = 'none';
        markdownBtn.style.display = 'block';
        saveBtn.style.display = 'block';
        markdownBtn.classList.remove('active');
        editVisualPane.focus();

      } else if (mode === 'raw') {
        rawPane.value = content;
        rawPane.classList.add('active');

        editBtn.style.display = 'none';
        markdownBtn.style.display = 'block';
        saveBtn.style.display = 'block';
        markdownBtn.classList.add('active');
        rawPane.focus();
      }
    }

    // Eventos dos Botões
    editBtn.addEventListener('click', () => {
      setMode('visual');
    });

    markdownBtn.addEventListener('click', () => {
      if (currentMode === 'visual') {
        // Salva estado do visual antes de trocar para raw
        const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
        if (note) note.content = getMarkdownFromHtml(editVisualPane);
        setMode('raw');
      } else {
        // Salva estado do raw antes de trocar para visual
        const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
        if (note) note.content = rawPane.value;
        setMode('visual');
      }
    });

    saveBtn.addEventListener('click', async () => {
      const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
      if (note) {
        if (currentMode === 'visual') {
          note.content = getMarkdownFromHtml(editVisualPane);
        } else if (currentMode === 'raw') {
          note.content = rawPane.value;
        }

        // Verifica se o título mudou para realizar a renomeação segura
        const newTitle = getNoteTitle(note.content);
        const desiredFilename = await getUniqueFilenameFS(NotebookStorage.activeNotebook, newTitle, currentNoteId);
        const newId = desiredFilename.replace('.md', '');

        if (newId !== currentNoteId) {
          if (isCapacitor) {
            // Deleta o arquivo físico antigo
            await NotebookStorage.deleteNoteFS(currentNoteId);
          }
          // Remove no cache LS se necessário, ou atualiza id da lista
          note.id = newId;
          
          // Se for fallback do LocalStorage, também precisamos sincronizar a chave
          const key = `notepad_notes_${NotebookStorage.activeNotebook}`;
          localStorage.setItem(key, JSON.stringify(NotebookStorage.notes));

          currentNoteId = newId;
        }

        await saveNotesToStorage();
        updateDocumentTitle(note.content);
        renderNotesList();
      }
      setMode('read');
    });

    // Auto-save durante a digitação (otimizado sem renomear arquivos em tempo real para evitar lag)
    editVisualPane.addEventListener('input', async () => {
      const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
      if (note) {
        note.content = getMarkdownFromHtml(editVisualPane);
        await saveNotesToStorage();
        updateDocumentTitle(note.content);
        
        // Atualiza dinamicamente o título na sidebar sem reconstruir toda a lista
        const activeItem = notesListContainer.querySelector('.note-item.active .note-item-title');
        if (activeItem) {
          activeItem.textContent = getNoteTitle(note.content);
        }
      }
    });

    rawPane.addEventListener('input', async () => {
      const note = NotebookStorage.notes.find(n => n.id === currentNoteId);
      if (note) {
        note.content = rawPane.value;
        await saveNotesToStorage();
        updateDocumentTitle(note.content);
        
        // Atualiza dinamicamente o título na sidebar sem reconstruir toda a lista
        const activeItem = notesListContainer.querySelector('.note-item.active .note-item-title');
        if (activeItem) {
          activeItem.textContent = getNoteTitle(note.content);
        }
      }
    });

    function updateDocumentTitle(content) {
      document.title = getNoteTitle(content);
    }

    // Zoom (Pinch-to-Zoom e Ctrl+Scroll)
    function updateFontSize(size) {
      currentFontSize = Math.min(Math.max(size, 10), 60);
      document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
      localStorage.setItem('notepad_font_size', currentFontSize);
    }

    // Inicialização da aplicação unificada
    async function initApp() {
      await NotebookStorage.init();
      activeNotebookTitle.textContent = NotebookStorage.activeNotebook;
      
      currentNoteId = localStorage.getItem('notepad_current_note_id_' + NotebookStorage.activeNotebook) || 
                      localStorage.getItem('notepad_current_note_id') || 
                      (NotebookStorage.notes[0] ? NotebookStorage.notes[0].id : null);
      
      if (!currentNoteId && NotebookStorage.notes.length > 0) {
        currentNoteId = NotebookStorage.notes[0].id;
      }

      loadCurrentNote();
      renderNotebooksList();
      updateFontSize(currentFontSize);
    }
    initApp();

    let initialDistance = null;
    let initialFontSize = 18;

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = getDistance(e.touches);
        initialFontSize = currentFontSize;
      }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialDistance !== null) {
        const newDistance = getDistance(e.touches);
        const scale = newDistance / initialDistance;
        updateFontSize(initialFontSize * scale);
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialDistance = null;
    }, { passive: true });

    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    document.addEventListener('wheel', (e) => {
      if (e.ctrlKey) {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 1.1 : 0.9;
        updateFontSize(currentFontSize * delta);
      }
    }, { passive: false });
  </script>
</body>
</html>
