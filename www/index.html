<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bloco de Notas Markdown</title>
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" type="image/png" href="icon-192.png">
  <meta name="theme-color" content="#0a0a0c">
  
  <!-- Google Fonts & Fira Code para o editor raw -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <!-- Capacitor Core Script -->
  <script src="capacitor.js"></script>
  <!-- Parser de Markdown e Conversores (Offline) -->
  <script src="marked.min.js"></script>
  <script src="turndown.js"></script>

  <style>
    :root {
      --bg-primary: #0a0a0c;
      --bg-secondary: rgba(18, 18, 22, 0.85);
      --bg-tertiary: #16161f;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.15);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-glow: rgba(79, 70, 229, 0.4);
      --success: #10b981;
      --success-hover: #059669;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'Fira Code', monospace;
      
      --font-size: 18px;
      --line-height: 1.6;
      --header-height: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      touch-action: none;
      position: relative;
    }

    /* Top Header Bar */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: rgba(10, 10, 12, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    /* Elementos Flutuantes originais reajustados para layout fixo */
    #menu-btn {
      position: static;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .top-actions {
      position: static;
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: var(--font-sans);
    }

    .action-btn:hover {
      background-color: var(--bg-secondary);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .action-btn:active {
      transform: translateY(1px);
    }

    .action-btn.active {
      background-color: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .action-btn.primary {
      background-color: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    .action-btn.primary:hover {
      background-color: var(--success-hover);
      border-color: var(--success-hover);
    }

    /* Botão Quadrado de Opções (3 Pontinhos) */
    .action-btn.square-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
    }

    /* Menu Dropdown de Opções da Nota */
    .note-menu-dropdown {
      position: fixed;
      top: calc(var(--header-height) - 4px);
      right: 16px;
      background: rgba(22, 22, 31, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 6px;
      min-width: 190px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      z-index: 250;
      display: none;
      flex-direction: column;
      gap: 2px;
      transform-origin: top right;
      animation: menuFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .note-menu-dropdown.active {
      display: flex;
    }

    @keyframes menuFadeIn {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(-8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .note-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      font-family: var(--font-sans);
      transition: all 0.15s ease;
    }

    .note-menu-item:hover {
      background-color: rgba(255, 255, 255, 0.08);
      transform: translateX(2px);
    }

    .note-menu-item:active {
      transform: translateX(0);
    }

    .note-menu-item.danger {
      color: var(--danger);
    }

    .note-menu-item.danger:hover {
      background-color: rgba(239, 68, 68, 0.15);
    }

    .note-menu-divider {
      height: 1px;
      background-color: var(--border-color);
      margin: 4px 0;
    }

    /* Foto de Capa da Nota */
    .note-cover-box {
      position: relative;
      width: calc(100% + 60px);
      margin-left: -30px;
      margin-right: -30px;
      height: 180px;
      overflow: hidden;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      user-select: none;
    }

    .note-cover-box::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: linear-gradient(to bottom, rgba(10, 10, 12, 0.7) 0%, rgba(10, 10, 12, 0) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .note-cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .note-cover-remove-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(10, 10, 12, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .note-cover-remove-btn:hover {
      background: var(--danger);
      border-color: var(--danger);
      transform: scale(1.1);
    }

    #raw-pane-wrapper {
      background-color: var(--bg-primary);
      padding: 8px 30px 30px 30px;
      overflow-y: auto;
    }

    #raw-pane-wrapper #raw-pane {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: block;
      background-color: transparent;
      color: rgba(255, 255, 255, 0.85);
      font-family: var(--font-mono);
      font-size: var(--font-size);
      line-height: var(--line-height);
      resize: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: none;
      outline: none;
      padding: 0;
      min-height: calc(100vh - var(--header-height) - 60px);
    }

    /* Dashboard UI */
    .dashboard-pane {
      width: 100%;
      height: calc(100vh - var(--header-height));
      margin-top: var(--header-height);
      background-color: var(--bg-primary);
      padding: 16px 24px 60px 24px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      animation: fadeIn 0.25s ease-out;
    }

    .dashboard-content {
      max-width: 960px;
      margin: 0 auto;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      gap: 16px;
    }

    .dashboard-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .dashboard-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }

    .stat-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stat-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(79, 70, 229, 0.15);
      border: 1px solid rgba(79, 70, 229, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .stat-info {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Dashboard Sections */
    .dashboard-section {
      margin-bottom: 36px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-header h2 {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .section-badge {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg-tertiary);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    /* Cards Horizontal Scroll */
    .cards-scroll-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 12px;
      scroll-behavior: smooth;
    }

    .cards-scroll-container::-webkit-scrollbar {
      height: 6px;
    }

    .cards-scroll-container::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .dashboard-note-card {
      flex: 0 0 180px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .dashboard-note-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(79, 70, 229, 0.25);
    }

    .dash-card-cover {
      width: 100%;
      height: 90px;
      background: #121216;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--border-color);
    }

    .dash-card-cover-placeholder {
      width: 100%;
      height: 90px;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.2), rgba(16, 185, 129, 0.15));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }

    .dash-card-body {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dash-card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dash-card-snippet {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Pinned / Vertical List */
    .pinned-list-container {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
    }

    .dash-list-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .dash-list-item:last-child {
      border-bottom: none;
    }

    .dash-list-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .dash-list-icon {
      font-size: 20px;
    }

    .dash-list-details {
      flex: 1;
    }

    .dash-list-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .dash-list-meta {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* FAB - Botão Flutuante */
    .fab-new-note {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 99;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      border: none;
      color: #ffffff;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .fab-new-note:hover {
      transform: scale(1.1) rotate(90deg);
      box-shadow: 0 12px 32px var(--accent-glow);
    }

    .fab-new-note:active {
      transform: scale(0.95);
    }

    /* Sidebar / Aba Lateral */
    #sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 290px;
      height: 100vh;
      height: 100dvh;
      background: var(--bg-secondary);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-color);
      z-index: 200;
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom)) 20px;
      box-shadow: 15px 0 40px rgba(0, 0, 0, 0.8);
    }

    #sidebar.open {
      left: 0;
    }

    .sidebar-brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .search-box-container {
      position: relative;
      width: 100%;
      margin-bottom: 12px;
    }

    .search-box-container input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px 10px 38px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-sans);
      outline: none;
      transition: all 0.25s ease;
    }

    .search-box-container input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(79, 70, 229, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Toolbar de Formatação Rápida */
    .format-toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 6px 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .format-toolbar.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .format-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-family: var(--font-sans);
      font-weight: 600;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .format-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 20px;
      padding-right: 4px;
    }

    /* Scrollbar minimalista */
    .notes-list::-webkit-scrollbar, .view-pane::-webkit-scrollbar, .dashboard-pane::-webkit-scrollbar {
      width: 6px;
    }
    .notes-list::-webkit-scrollbar-track, .view-pane::-webkit-scrollbar-track, .dashboard-pane::-webkit-scrollbar-track {
      background: transparent;
    }
    .notes-list::-webkit-scrollbar-thumb, .view-pane::-webkit-scrollbar-thumb, .dashboard-pane::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
    .notes-list::-webkit-scrollbar-thumb:hover, .view-pane::-webkit-scrollbar-thumb:hover, .dashboard-pane::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .note-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .note-item:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-color: var(--border-hover);
      transform: translateX(4px);
    }

    .note-item.active {
      background: rgba(79, 70, 229, 0.15);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: inset 0 0 8px rgba(79, 70, 229, 0.2);
    }

    .note-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 8px;
    }

    .delete-note-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .delete-note-btn:hover {
      color: var(--danger);
      background-color: rgba(239, 68, 68, 0.15);
    }

    .sidebar-action-btn {
      background-color: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      text-align: center;
      font-family: var(--font-sans);
    }

    .sidebar-action-btn:hover {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Modais */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: var(--text-primary);
    }

    .modal-body {
      padding: 0;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .setting-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .setting-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .setting-description {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      transition: .3s;
      border-radius: 26px;
      border: 1px solid var(--border-color);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text-secondary);
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: #ffffff;
    }

    /* Título da Nota */
    /* Novo Container do Título no Header */
    .header-title-container {
      position: relative;
      flex: 1;
      margin: 0 16px;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .note-title-input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 400;
      font-family: var(--font-sans);
      outline: none;
      padding: 0;
      margin: 0;
      overflow: hidden;
      text-overflow: clip;
      white-space: nowrap;
      mask-image: linear-gradient(to right, black calc(100% - 24px), transparent 100%);
      -webkit-mask-image: linear-gradient(to right, black calc(100% - 24px), transparent 100%);
    }
    .note-title-input:focus {
      border: none;
    }
    .note-title-input:disabled {
      color: var(--text-primary);
      opacity: 0.9;
    }
    .note-title-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }
    .note-title-input::-webkit-input-placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    /* Containers de Visualização */
    .editor-container {
      width: 100%;
      height: 100vh;
      margin-top: 0;
      position: relative;
      background-color: var(--bg-primary);
      display: flex;
      flex-direction: column;
    }

    .view-pane {
      width: 100%;
      height: 100%;
      padding: 70px 30px 30px 30px;
      font-size: var(--font-size);
      line-height: var(--line-height);
      overflow-y: auto;
      touch-action: pan-y;
      border: none;
      outline: none;
      display: none;
      background-color: transparent;
    }

    .view-pane.active {
      display: block;
    }

    /* Modo Leitura */
    #read-pane {
      background-color: var(--bg-primary);
      color: #e4e4e7;
      user-select: text;
    }

    /* Modo Edição Visual */
    #edit-visual-pane {
      background-color: var(--bg-primary);
      color: #e4e4e7;
    }

    #edit-visual-pane[data-placeholder]:not(.has-content)::before {
      content: attr(data-placeholder);
      font-size: var(--font-size);
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      display: inline-block;
    }

    /* Markdown Body Styling */
    .markdown-body {
      max-width: 800px;
      margin: 0 auto;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 { 
      margin-top: 1.4em;
      margin-bottom: 0.6em; 
      color: #ffffff; 
      font-weight: 600;
    }
    .markdown-body h1 { 
      font-size: 2.2em; 
      border-bottom: 1px solid var(--border-color); 
      padding-bottom: 0.4em; 
      margin-bottom: 1em; 
    }
    .markdown-body h2 { font-size: 1.65em; }
    .markdown-body h3 { font-size: 1.3em; }
    .markdown-body p { margin-bottom: 1.2em; color: rgba(255, 255, 255, 0.9); }
    .markdown-body code { 
      background: rgba(255, 255, 255, 0.06); 
      padding: 3px 6px; 
      border-radius: 6px; 
      font-family: var(--font-mono); 
      font-size: 0.9em;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .markdown-body pre { 
      background: var(--bg-tertiary); 
      padding: 16px; 
      border-radius: 12px; 
      overflow-x: auto; 
      margin-bottom: 1.4em; 
      border: 1px solid var(--border-color);
    }
    .markdown-body pre code { background: none; padding: 0; border: none; }
    .markdown-body ul, .markdown-body ol { margin-left: 24px; margin-bottom: 1.2em; color: rgba(255, 255, 255, 0.9); }
    .markdown-body li { margin-bottom: 0.4em; }
    .markdown-body blockquote { 
      border-left: 4px solid var(--accent); 
      padding-left: 16px; 
      color: var(--text-secondary); 
      margin-bottom: 1.4em; 
      font-style: italic;
    }

    #read-pane:empty:before {
      content: "Nota vazia.";
      color: var(--text-muted);
    }

    /* Modo Código Raw */
    #raw-pane {
      width: 100%;
      height: 100%;
      background-color: transparent;
      color: rgba(255, 255, 255, 0.85);
      font-family: var(--font-mono);
      font-size: var(--font-size);
      resize: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: none;
      outline: none;
      padding: 0;
    }

    #raw-pane::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }
    #raw-pane::-webkit-input-placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

  <script>
    const readPane = document.getElementById('read-pane');
    const editVisualPane = document.getElementById('edit-visual-pane');
    const rawPane = document.getElementById('raw-pane');
    const rawPaneWrapper = document.getElementById('raw-pane-wrapper');
    const rawCoverBox = document.getElementById('raw-cover-box');

    const preferencesBtn = document.getElementById('preferences-btn');
    const preferencesModal = document.getElementById('preferences-modal');
    const closePreferencesBtn = document.getElementById('close-preferences-btn');
    const prefMarkdownCheckbox = document.getElementById('pref-markdown-checkbox');

    const deleteConfirmModal = document.getElementById('delete-confirm-modal');
    const closeDeleteModalBtn = document.getElementById('close-delete-modal-btn');
    const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
    const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
    const deleteModalMessage = document.getElementById('delete-modal-message');
    let noteIdToDelete = null;

    let prefersMarkdown = localStorage.getItem('notepad_prefers_markdown') === 'true';
    prefMarkdownCheckbox.checked = prefersMarkdown;

    const editBtn = document.getElementById('edit-btn');
    const saveBtn = document.getElementById('save-btn');
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const newNoteBtn = document.getElementById('new-note-btn');
    const notesListContainer = document.getElementById('notes-list');
    const installAppBtn = document.getElementById('install-app-btn');
    const installAppSetting = document.getElementById('install-app-setting');

    // Menu da Nota (3 Pontinhos) & Capa
    const noteMenuBtn = document.getElementById('note-menu-btn');
    const noteMenuDropdown = document.getElementById('note-menu-dropdown');
    const coverFileInput = document.getElementById('cover-file-input');
    const menuAddCoverBtn = document.getElementById('menu-add-cover-btn');
    const menuRemoveCoverBtn = document.getElementById('menu-remove-cover-btn');
    const menuPinNoteBtn = document.getElementById('menu-pin-note-btn');
    const menuDuplicateNoteBtn = document.getElementById('menu-duplicate-note-btn');
    const menuDeleteNoteBtn = document.getElementById('menu-delete-note-btn');

    // Detecta se está rodando no Capacitor com o plugin Filesystem
    const isCapacitor = typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
    const fsDir = (typeof Capacitor !== 'undefined' && Capacitor.getPlatform() === 'android') ? 'EXTERNAL' : 'DOCUMENTS';

    function extractCoverAndContent(rawContent) {
      let cover = null;
      let pinned = false;
      let content = rawContent || '';
      
      const pinnedMatch = content.match(/^<!--PINNED:(.*?)-->\n?/);
      if (pinnedMatch) {
        pinned = pinnedMatch[1] === 'true';
        content = content.replace(/^<!--PINNED:(.*?)-->\n?/, '');
      }

      const mdCoverMatch = content.match(/^\s*!\[(?:capa|cover)\]\((.*?)\)\s*\n?/i);
      if (mdCoverMatch) {
        cover = mdCoverMatch[1];
        content = content.replace(/^\s*!\[(?:capa|cover)\]\((.*?)\)\s*\n?/i, '');
      }

      if (cover) {
        const escapedCover = cover.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const mdImageRegex = new RegExp(`^\\s*!\\[.*?\\]\\(${escapedCover}\\)\\s*\\n?`, 'g');
        content = content.replace(mdImageRegex, '');
      }

      return { cover, pinned, content };
    }

    function packCoverAndContent(content, cover, pinned) {
      let meta = '';
      if (pinned) {
        meta += `<!--PINNED:true-->\n`;
      }
      if (cover) {
        meta += `![capa](${cover})\n`;
      }
      return meta + content;
    }

    // Gerenciador de Armazenamento de Notas (LocalStorage rápido + Filesystem em segundo plano)
    const NoteStorage = {
      notes: [],

      resolvePath(filename = '') {
        let resolved = 'mkd-notes';
        if (filename) {
          resolved += '/' + filename;
        }
        return {
          path: resolved,
          directory: fsDir
        };
      },

      async init() {
        if (isCapacitor) {
          try {
            const permStatus = await Capacitor.Plugins.Filesystem.checkPermissions();
            if (permStatus.publicStorage !== 'granted') {
              const reqResult = await Capacitor.Plugins.Filesystem.requestPermissions();
              if (reqResult.publicStorage !== 'granted') {
                console.warn("Permissão de armazenamento não concedida pelo usuário.");
              }
            }

            await Capacitor.Plugins.Filesystem.mkdir({
              path: 'mkd-notes',
              directory: fsDir,
              recursive: true
            }).catch(() => {});
            
            this.loadNotesLS();
            await this.syncNotesFS();
          } catch (e) {
            console.error("Falha ao inicializar Filesystem, usando localStorage fallback.", e);
            this.initLocalStorage();
          }
        } else {
          this.initLocalStorage();
        }
      },

      initLocalStorage() {
        this.loadNotesLS();
      },

      loadNotesLS() {
        let saved = localStorage.getItem('notepad_notes');
        if (!saved) {
          saved = localStorage.getItem('notepad_notes_Minhas Notas');
        }
        this.notes = saved ? JSON.parse(saved) : [];
        this.notes.forEach(n => {
          if (n.content) {
            const existingCover = n.cover;
            const existingPinned = n.pinned;
            const parsed = extractCoverAndContent(n.content);
            n.cover = parsed.cover !== null ? parsed.cover : (existingCover !== undefined ? existingCover : null);
            n.pinned = parsed.pinned || (existingPinned === true);
            n.content = parsed.content;
          }
        });
        if (this.notes.length === 0) {
          this.notes = [{
            id: 'Minhas Notas',
            content: 'Comece a digitar sua primeira nota aqui...',
            cover: null
          }];
          this.saveNotesLS();
        }
      },

      async syncNotesFS() {
        if (!isCapacitor) return;
        const syncIndicator = document.getElementById('sync-indicator');
        if (syncIndicator) syncIndicator.style.display = 'inline-block';

        try {
          await Capacitor.Plugins.Filesystem.mkdir(Object.assign({ recursive: true }, this.resolvePath())).catch(() => {});

          const result = await Capacitor.Plugins.Filesystem.readdir(this.resolvePath());
          const files = result.files.map(f => typeof f === 'string' ? f : f.name);

          const fsNotesMap = new Map();
          for (const file of files) {
            if (file.endsWith('.md')) {
              try {
                const fileContent = await Capacitor.Plugins.Filesystem.readFile(Object.assign({ encoding: 'utf8' }, this.resolvePath(file)));
                fsNotesMap.set(file.replace('.md', ''), fileContent.data);
              } catch (err) {
                console.error("Erro ao ler nota na sincronização", err);
              }
            }
          }

          let localNotes = this.notes;
          let hasChanges = false;

          fsNotesMap.forEach((fsContent, id) => {
            const parsed = extractCoverAndContent(fsContent);
            const localNote = localNotes.find(n => n.id === id);
            if (!localNote) {
              localNotes.push({ id, content: parsed.content, cover: parsed.cover, pinned: parsed.pinned });
              hasChanges = true;
            } else if (localNote.content !== parsed.content || localNote.cover !== parsed.cover || localNote.pinned !== parsed.pinned) {
              localNote.content = parsed.content;
              localNote.cover = parsed.cover;
              localNote.pinned = parsed.pinned;
              hasChanges = true;
            }
          });

          for (const localNote of localNotes) {
            if (!fsNotesMap.has(localNote.id)) {
              const fullContent = packCoverAndContent(localNote.content, localNote.cover, localNote.pinned);
              await this.saveNoteFS(localNote.id, fullContent);
            }
          }

          if (hasChanges || localNotes.length === 0) {
            if (localNotes.length === 0) {
              localNotes = [{
                id: 'Minhas Notas',
                content: 'Comece a digitar sua primeira nota aqui...',
                cover: null,
                pinned: false
              }];
              await this.saveNoteFS(localNotes[0].id, packCoverAndContent(localNotes[0].content, null, false));
            }
            this.notes = localNotes.sort((a, b) => b.id.localeCompare(a.id));
            this.saveNotesLS();
            loadCurrentNote();
          } else {
            this.notes = localNotes.sort((a, b) => b.id.localeCompare(a.id));
          }
        } catch (e) {
          console.error("Erro ao rodar sincronização", e);
        } finally {
          if (syncIndicator) {
            setTimeout(() => {
              syncIndicator.style.display = 'none';
            }, 600);
          }
        }
      },

      saveNotesLS() {
        localStorage.setItem('notepad_notes', JSON.stringify(this.notes));
      },

      async saveNoteFS(id, content) {
        if (!isCapacitor) return;
        try {
          await Capacitor.Plugins.Filesystem.writeFile(Object.assign({ data: content, encoding: 'utf8' }, this.resolvePath(`${id}.md`)));
        } catch (e) {
          console.error("Erro ao salvar nota no Filesystem", e);
        }
      },

      async deleteNoteFS(id) {
        if (!isCapacitor) return;
        try {
          await Capacitor.Plugins.Filesystem.deleteFile(this.resolvePath(`${id}.md`));
        } catch (e) {
          console.error("Erro ao deletar arquivo", e);
        }
      }
    };

    // Estado do App
    let currentNoteId = null;
    let currentMode = 'read';
    let activeView = 'editor'; // 'editor' | 'dashboard'
    let currentFontSize = parseFloat(localStorage.getItem('notepad_font_size')) || 18;

    // Elementos do Dashboard

    const dashboardNewNoteBtn = document.getElementById('dashboard-new-note-btn');

    async function cleanupEmptyNotes(exceptId = null) {
      if (NoteStorage.notes.length <= 1) return;
      const emptyNotes = NoteStorage.notes.filter(note => {
        if (exceptId && note.id === exceptId) return false;
        return !note.content || note.content.trim() === '';
      });
      if (emptyNotes.length > 0) {
        const emptyIds = emptyNotes.map(n => n.id);
        NoteStorage.notes = NoteStorage.notes.filter(note => !emptyIds.includes(note.id));
        for (const id of emptyIds) {
          if (isCapacitor) {
            await NoteStorage.deleteNoteFS(id);
          }
        }
        if (emptyIds.includes(currentNoteId) && NoteStorage.notes.length > 0) {
          currentNoteId = NoteStorage.notes[0].id;
        }
        await saveNotesToStorage();
      }
    }

    function getNoteSnippet(content) {
      if (!content) return 'Sem conteúdo...';
      const clean = content.replace(/^#+\s+/g, '').replace(/<!--COVER:.*?-->/g, '').trim();
      const lines = clean.split('\n').filter(l => l.trim() !== '');
      const snippetLine = lines.length > 1 ? lines.slice(1).join(' ') : lines[0] || '';
      return snippetLine.substring(0, 80).trim() || 'Sem conteúdo adicional...';
    }

    function formatRelativeTime(noteId) {
      const timestamp = parseInt(noteId, 10);
      if (isNaN(timestamp)) return 'Editado recentemente';

      const now = Date.now();
      const diffMs = now - timestamp;
      const diffMinutes = Math.floor(diffMs / (1000 * 60));
      const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      if (diffMinutes < 5) return 'Editado agora mesmo';
      if (diffMinutes < 60) return `Editado há ${diffMinutes} min`;
      if (diffHours < 24) return `Editado há ${diffHours}h`;
      if (diffDays === 1) return 'Editado ontem';
      if (diffDays < 30) return `Editado há ${diffDays} dias`;

      const date = new Date(timestamp);
      return `Editado em ${date.toLocaleDateString('pt-BR', { month: 'short', day: 'numeric' })}`;
    }

    function renderDashboard() {
      const notes = NoteStorage.notes || [];

      // Renderizar Cards de Notas Recentes (Horizontal Scroll)
      const recentCardsContainer = document.getElementById('recent-cards-container');
      
      if (recentCardsContainer) {
        recentCardsContainer.innerHTML = '';
        const recentNotes = notes.slice(0, 10);

        if (recentNotes.length === 0) {
          recentCardsContainer.innerHTML = `<p style="color: var(--text-muted); font-size: 14px; padding: 10px;">Nenhuma nota encontrada.</p>`;
        } else {
          recentNotes.forEach(note => {
            const title = getNoteDisplayTitle(note);
            const snippet = getNoteSnippet(note.content);
            
            const card = document.createElement('div');
            card.className = 'dashboard-note-card';
            card.onclick = async () => {
              await cleanupEmptyNotes(note.id);
              currentNoteId = note.id;
              openEditorView();
              loadCurrentNote();
            };

            if (note.cover) {

                <img src="${note.cover}" class="dash-card-cover" alt="Capa da nota">

                  <div class="dash-card-snippet">${snippet}</div>
                </div>
              `;
            } else {
              card.innerHTML = `
                <div class="dash-card-cover-placeholder">📄</div>
                <div class="dash-card-body">
                  <div class="dash-card-title">${title}</div>
                  <div class="dash-card-snippet">${snippet}</div>
                </div>

            recentCardsContainer.appendChild(card);
          });

      }

      // Configurar o botão "See all"
      const dashSeeAllBtn = document.getElementById('dash-see-all-btn');

        dashSeeAllBtn.onclick = () => {

          overlay.classList.add('active');
        };
      }

      // Renderizar Lista Vertical de Notas (Estilo Pinned/List do Screenshot)
      const dashNotesList = document.getElementById('dashboard-notes-list');
      if (dashNotesList) {
        dashNotesList.innerHTML = '';

        if (pinnedNotes.length === 0) {
          dashNotesList.innerHTML = `<div class="dash-list-item" style="cursor: default;"><span style="color: var(--text-muted);">Nenhuma nota fixada. Marque "Fixar Nota" no menu de opções.</span></div>`;
        } else {

            const timeMeta = formatRelativeTime(note.id);
            const item = document.createElement('div');
            item.className = 'dash-list-item';
            item.addEventListener('click', async () => {
              await cleanupEmptyNotes(note.id);

              openEditorView();

              <div class="dash-list-icon-box">${note.cover ? '🖼️' : '📌'}</div>

    // Sidebar close
    overlay.addEventListener('click', closeSidebar);

    menuBtn.addEventListener('click', () => {

      overlay.classList.toggle('active');

    function getNoteDisplayTitle(note) {
      if (!note) return 'Nova Nota';
      const isTimestamp = /^\d{13}$/.test(note.id);
      if (isTimestamp) {
        return getTitleFromContent(note.content);
      }
      return note.id;
    }

    // Carregar Nota Atual
    function loadCurrentNote() {
      const note = NoteStorage.notes.find(n => n.id === currentNoteId);
      if (note) {
        setMode('read');
        const titleInput = document.getElementById('note-title-input');
        if (titleInput) {

    async function saveNotesToStorage() {
      NoteStorage.saveNotesLS();
      localStorage.setItem('notepad_current_note_id', currentNoteId);

      if (isCapacitor) {
        const note = NoteStorage.notes.find(n => n.id === currentNoteId);
        if (note) {
          const fullContent = packCoverAndContent(note.content, note.cover, note.pinned);
          NoteStorage.saveNoteFS(note.id, fullContent);
        }
      }
    }

    function getNoteTitle(content) {
      if (!content || content.trim() === '') return 'Nota Sem Título';
      const cleanContent = content.replace(/^#+\s+/g, '').trim();
      const firstLine = cleanContent.split('\n')[0] || '';
      return firstLine.substring(0, 20).trim() || 'Nota Sem Título';
    }

    function sanitizeFilename(title) {
      if (!title || title.trim() === '') return 'Nova Nota';
      let clean = title.replace(/[\/\\:*?"<>|]/g, '_').trim();
      return clean || 'Nova Nota';
    }

    async function getUniqueFilenameFS(desiredTitle, excludeId) {
      const baseName = sanitizeFilename(desiredTitle);
      let filename = `${baseName}.md`;
      if (!isCapacitor) {
        const localNotes = NoteStorage.notes;
        let counter = 1;
        while (localNotes.some(n => n.id === filename.replace('.md', '') && n.id !== excludeId)) {
          counter++;
          filename = `${baseName}-${counter}.md`;
        }
        return filename;
      }
      try {
        const result = await Capacitor.Plugins.Filesystem.readdir(
          NoteStorage.resolvePath()
        );
        const files = result.files.map(f => typeof f === 'string' ? f : f.name);
        let counter = 1;
        while (files.includes(filename)) {
          if (filename.replace('.md', '') === excludeId) {
            break;
          }
          counter++;
          filename = `${baseName}-${counter}.md`;
        }
      } catch (e) {
        // Diretorio nao existe
      }
      return filename;
    }

    function renderNotesList() {
      notesListContainer.innerHTML = '';
      const searchInput = document.getElementById('search-notes-input');
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';

      const filteredNotes = NoteStorage.notes.filter(note => {
        if (!query) return true;

        const content = note.content.toLowerCase();
        return title.includes(query) || content.includes(query);
      });

      filteredNotes.forEach(note => {

          closeSidebar();

        notesListContainer.appendChild(item);

        id: newId,

      if (titleInput) titleInput.value = '';

      newNoteBtn.addEventListener('click', handleNewNote);

    const bottomNewNoteBtn = document.getElementById('bottom-new-note-btn');
    if (bottomNewNoteBtn) {
      bottomNewNoteBtn.addEventListener('click', handleNewNote);

    async function deleteNote(id) {
      if (NoteStorage.notes.length <= 1) return;
      const note = NoteStorage.notes.find(n => n.id === id);
      const title = getNoteTitle(note ? note.content : '');
      
      noteIdToDelete = id;
      deleteModalMessage.textContent = `Deseja realmente excluir a nota "${title}"?`;
      deleteConfirmModal.classList.add('active');
      deleteConfirmModal.style.display = 'flex';

    const closeDeleteModal = () => {
      deleteConfirmModal.classList.remove('active');

        }
      }, 250);

    };

    closeDeleteModalBtn.addEventListener('click', closeDeleteModal);

    deleteConfirmModal.addEventListener('click', (e) => {

      }

    confirmDeleteBtn.addEventListener('click', async () => {

          await NoteStorage.deleteNoteFS(id);
        }

          currentNoteId = NoteStorage.notes[0].id;
        }
        saveNotesToStorage();
        loadCurrentNote();
        closeDeleteModal();
      }
    });

    // Configura o Marked para converter quebras de linha simples (\n) em <br>
    if (typeof marked.use === 'function') {
      marked.use({ breaks: true, gfm: true });
    } else if (typeof marked.setOptions === 'function') {
      marked.setOptions({ breaks: true, gfm: true });
    }

    // Inicialização do Turndown para conversão reversa de HTML para Markdown
    const turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });

    turndownService.addRule('ignoreCover', {
      filter: function (node) {
        return node.classList && node.classList.contains('note-cover-box');
      },
      replacement: function () {
        return '';
      }
    });

    turndownService.addRule('div', {
      filter: 'div',
      replacement: function (content, node) {
        if (node.innerHTML === '<br>' || node.innerHTML === '') {
          return '\n';
        }
        return '\n' + content;
      }
    });

    turndownService.addRule('p', {
      filter: 'p',
      replacement: function (content) {
        return '\n\n' + content + '\n\n';
      }
    });

    turndownService.addRule('br', {
      filter: 'br',
      replacement: function () {
        return '\n';
      }
    });

    function getCleanMarkdownText(element) {
      let rawText = element.innerText || '';
      let lines = rawText.replace(/\u00A0/g, ' ').replace(/\r\n/g, '\n').split('\n');
      return lines.map(line => line.trimEnd()).join('\n').trim();
    }

    function getMarkdownFromHtml(element) {
      const clone = element.cloneNode(true);
      const covers = clone.querySelectorAll('.note-cover-box');
      covers.forEach(c => c.remove());
      
      let markdown = turndownService.turndown(clone.innerHTML);
      markdown = markdown.replace(/\r\n/g, '\n');
      markdown = markdown.split('\n').map(line => line.trimEnd()).join('\n');
      return markdown.replace(/\n{3,}/g, '\n\n').trim();
    }

    function renderCoverHTML(coverUrl) {
      if (!coverUrl) return '';
      return `<div class="note-cover-box" contenteditable="false">
        <img src="${coverUrl}" alt="Capa da Nota">
        <button class="note-cover-remove-btn" onclick="removeNoteCover(event)" title="Remover Capa">✕</button>
      </div>`;
    }

    function updateVisualPanePlaceholder() {
      const text = editVisualPane.innerText || '';
      const cleanText = text.replace(/✕/g, '').trim();
      if (cleanText.length === 0) {
        editVisualPane.classList.remove('has-content');
      } else {
        editVisualPane.classList.add('has-content');
      }
    }

    // Controle de Modos e Visibilidade
    function setMode(mode) {
      currentMode = mode;
      const note = NoteStorage.notes.find(n => n.id === currentNoteId);
      const content = note ? note.content : '';
      const cover = note ? note.cover : null;
      const formatToolbar = document.getElementById('format-toolbar');

      readPane.classList.remove('active');
      editVisualPane.classList.remove('active');
      if (rawPaneWrapper) rawPaneWrapper.classList.remove('active');

      const coverHtml = renderCoverHTML(cover);

      if (mode === 'read') {
        readPane.innerHTML = coverHtml + (content ? marked.parse(content) : '');
        readPane.classList.add('active');

        editBtn.style.display = 'block';
        saveBtn.style.display = 'none';

      coverFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = async (event) => {
            const base64Url = event.target.result;
            const note = NoteStorage.notes.find(n => n.id === currentNoteId);
            if (note) {
              note.cover = base64Url;

        const note = NoteStorage.notes.find(n => n.id === currentNoteId);

        await saveNotesToStorage();
        setMode(currentMode);

    // Inserção e formatação rápida (Markdown Helper)
    function insertFormat(type) {
      if (currentMode === 'visual') {
        editVisualPane.focus();
        if (type === 'bold') {
          document.execCommand('bold', false);
        } else if (type === 'italic') {
          document.execCommand('italic', false);
        } else if (type === 'header') {
          document.execCommand('formatBlock', false, '<h3>');
        } else if (type === 'quote') {
          document.execCommand('formatBlock', false, '<blockquote>');
        } else if (type === 'list') {
          document.execCommand('insertUnorderedList', false);
        } else if (type === 'code') {
          const selection = window.getSelection();
          if (!selection.isCollapsed) {
            const range = selection.getRangeAt(0);
            const code = document.createElement('code');
            code.appendChild(range.extractContents());
            range.insertNode(code);
          }
        }
        editVisualPane.dispatchEvent(new Event('input'));
      } else if (currentMode === 'raw') {
        rawPane.focus();
        const start = rawPane.selectionStart;
        const end = rawPane.selectionEnd;
        const text = rawPane.value;
        const selectedText = text.substring(start, end);
        let replacement = '';

        if (type === 'bold') {
          replacement = `**${selectedText}**`;
        } else if (type === 'italic') {
          replacement = `*${selectedText}*`;
        } else if (type === 'header') {
          replacement = `\n### ${selectedText}`;
        } else if (type === 'quote') {
          replacement = `\n> ${selectedText}`;
        } else if (type === 'list') {
          replacement = `\n- ${selectedText}`;
        } else if (type === 'code') {
          replacement = `\`${selectedText}\``;
        }

        rawPane.value = text.substring(0, start) + replacement + text.substring(end);
        rawPane.selectionStart = start + replacement.length;
        rawPane.selectionEnd = start + replacement.length;
        
        rawPane.dispatchEvent(new Event('input'));
      }
    }

    // Eventos dos Botões
    editBtn.addEventListener('click', () => {
      setMode(prefersMarkdown ? 'raw' : 'visual');
    });

    // Modal de Preferências Listeners
    preferencesBtn.addEventListener('click', () => {
      preferencesModal.classList.add('active');
      preferencesModal.style.display = 'flex';
      closeSidebar();
    });

    const closePreferences = () => {
      preferencesModal.classList.remove('active');
      setTimeout(() => {
        if (!preferencesModal.classList.contains('active')) {
          preferencesModal.style.display = 'none';
        }
      }, 250);
    };

    closePreferencesBtn.addEventListener('click', closePreferences);
    preferencesModal.addEventListener('click', (e) => {
      if (e.target === preferencesModal) {
        closePreferences();
      }
    });

    prefMarkdownCheckbox.addEventListener('change', () => {
      prefersMarkdown = prefMarkdownCheckbox.checked;
      localStorage.setItem('notepad_prefers_markdown', prefersMarkdown);
      
      if (prefersMarkdown) {
        if (currentMode === 'visual') {
          const note = NoteStorage.notes.find(n => n.id === currentNoteId);
          if (note) note.content = getMarkdownFromHtml(editVisualPane);
          setMode('raw');
        }
      } else {
        if (currentMode === 'raw') {
          const note = NoteStorage.notes.find(n => n.id === currentNoteId);
          if (note) note.content = rawPane.value;
          setMode('visual');
        }
      }
    });

    const prefStartupSelect = document.getElementById('pref-startup-select');
    if (prefStartupSelect) {
      prefStartupSelect.addEventListener('change', () => {
        localStorage.setItem('notepad_startup_behavior', prefStartupSelect.value);
      });
    }

    function getTitleFromContent(content) {
      if (!content || content.trim() === '') return 'Nova Nota';
      const clean = content
        .replace(/<!--COVER:.*?-->/g, '')
        .replace(/[#*`>_\-]/g, '')
        .trim();
      const words = clean.split(/\s+/).slice(0, 5).join(' ');
      return words.substring(0, 30).trim() || 'Nova Nota';
    }

    saveBtn.addEventListener('click', async () => {
      const note = NoteStorage.notes.find(n => n.id === currentNoteId);
      if (note) {
        if (currentMode === 'visual') {
          note.content = getMarkdownFromHtml(editVisualPane);
        } else if (currentMode === 'raw') {
          note.content = rawPane.value;
        }

        const titleInput = document.getElementById('note-title-input');
        let newTitle = titleInput ? titleInput.value.trim() : '';
        if (!newTitle) {
          newTitle = getTitleFromContent(note.content);
          if (titleInput) titleInput.value = newTitle;
        }

        const desiredFilename = await getUniqueFilenameFS(newTitle, currentNoteId);
        const newId = desiredFilename.replace('.md', '');

        if (newId !== currentNoteId) {
          if (isCapacitor) {
            await NoteStorage.deleteNoteFS(currentNoteId);
          }
          note.id = newId;
          NoteStorage.saveNotesLS();
          currentNoteId = newId;
        }

        await saveNotesToStorage();
        updateDocumentTitle(getNoteDisplayTitle(note));
        renderNotesList();
      }
      setMode('read');
    });

    const titleInput = document.getElementById('note-title-input');
    if (titleInput) {
      titleInput.addEventListener('change', async () => {
        const note = NoteStorage.notes.find(n => n.id === currentNoteId);
        if (note) {
          let newTitle = titleInput.value.trim();
          if (!newTitle) {
            // If cleared, rename back to a timestamp to show placeholder
            newTitle = Date.now().toString();
            titleInput.value = '';
          }

          const desiredFilename = await getUniqueFilenameFS(newTitle, currentNoteId);
          const newId = desiredFilename.replace('.md', '');

          if (newId !== currentNoteId) {
            if (isCapacitor) {
              await NoteStorage.deleteNoteFS(currentNoteId);
            }
            note.id = newId;
            NoteStorage.saveNotesLS();
            currentNoteId = newId;
            await saveNotesToStorage();
            updateDocumentTitle(getNoteDisplayTitle(note));
            renderNotesList();
          }
        }
      });
    }

    // Auto-save durante a digitação
    editVisualPane.addEventListener('input', async () => {
      updateVisualPanePlaceholder();
      const note = NoteStorage.notes.find(n => n.id === currentNoteId);
      if (note) {
        note.content = getMarkdownFromHtml(editVisualPane);
        await saveNotesToStorage();
        updateDocumentTitle(getNoteDisplayTitle(note));
        
        const activeItem = notesListContainer.querySelector('.note-item.active .note-item-title');
        if (activeItem) {
          activeItem.textContent = getNoteDisplayTitle(note);
        }
      }
    });

    rawPane.addEventListener('input', async () => {
      const note = NoteStorage.notes.find(n => n.id === currentNoteId);
      if (note) {
        note.content = rawPane.value;
        await saveNotesToStorage();
        updateDocumentTitle(getNoteDisplayTitle(note));
        
        const activeItem = notesListContainer.querySelector('.note-item.active .note-item-title');
        if (activeItem) {
          activeItem.textContent = getNoteDisplayTitle(note);
        }
      }
    });

    function updateDocumentTitle(title) {
      document.title = title || "Bloco de Notas";
    }

    // Zoom (Pinch-to-Zoom e Ctrl+Scroll)
    function updateFontSize(size) {
      currentFontSize = Math.min(Math.max(size, 10), 60);
      document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
      localStorage.setItem('notepad_font_size', currentFontSize);
    }

    // Inicialização da aplicação unificada
    async function initApp() {
      await NoteStorage.init();
      
      currentNoteId = localStorage.getItem('notepad_current_note_id') || 
                      (NoteStorage.notes[0] ? NoteStorage.notes[0].id : null);
      
      if (!currentNoteId && NoteStorage.notes.length > 0) {
        currentNoteId = NoteStorage.notes[0].id;
      }

      const startupBehavior = localStorage.getItem('notepad_startup_behavior') || 'last';
      const startupSelect = document.getElementById('pref-startup-select');
      if (startupSelect) {
        startupSelect.value = startupBehavior;
      }

      if (startupBehavior === 'dashboard') {
        await openDashboardView();
      } else {
        openEditorView();
        loadCurrentNote();
      }
      updateFontSize(currentFontSize);
    }
    initApp();

    let initialDistance = null;
    let initialFontSize = 18;

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = getDistance(e.touches);
        initialFontSize = currentFontSize;
      }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialDistance !== null) {
        const newDistance = getDistance(e.touches);
        const scale = newDistance / initialDistance;
        updateFontSize(initialFontSize * scale);
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialDistance = null;
    }, { passive: true });

    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    document.addEventListener('wheel', (e) => {
      if (e.ctrlKey) {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 1.1 : 0.9;
        updateFontSize(currentFontSize * delta);
      }
    }, { passive: false });

    // --- PWA / Instalação no Chrome ---
    let deferredPrompt;

    if ('serviceWorker' in navigator && !isCapacitor) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('Service Worker registrado com sucesso:', reg.scope);
        }).catch((err) => {
          console.warn('Erro ao registrar Service Worker:', err);
        });
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isCapacitor && installAppSetting) {
        installAppSetting.style.display = 'flex';
      }
    });

    if (installAppBtn) {
      installAppBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`Escolha do usuário sobre instalação: ${outcome}`);
        deferredPrompt = null;
        if (installAppSetting) installAppSetting.style.display = 'none';
      });
    }

    window.addEventListener('appinstalled', () => {
      console.log('Aplicativo instalado com sucesso.');
      deferredPrompt = null;
      if (installAppSetting) installAppSetting.style.display = 'none';
    });
  </script>
</body>
</html>
